    <script>
        const SUPABASE_URL = 'https://safymsagxrjymhfdzkph.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_qthdZZg-tjDRc_loLbVUYg_b77rK-Bv'; 
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        const PRODUCT_PRICE = 300;

        document.getElementById('payment-modal').style.display = 'none';
        document.getElementById('success-modal').style.display = 'none';

        function openPaymentModal() {
            if(typeof fbq === 'function') {
                fbq('track', 'InitiateCheckout', { content_name: 'Mega Bundle', value: PRODUCT_PRICE, currency: 'BDT' });
            }
            // Reset modal state
            document.getElementById('payment-details-section').style.display = 'none';
            document.querySelectorAll('.pay-method-btn').forEach(el => {
                el.style.display = 'block';
                el.classList.remove('border-pink-500', 'border-orange-500', 'border-purple-500', 'bg-slate-700');
                el.classList.add('border-slate-600', 'bg-slate-800');
            });
            document.getElementById('payment-modal').style.display = 'flex';
        }

        function closePaymentModal() {
            document.getElementById('payment-modal').style.display = 'none';
            document.getElementById('error-msg').classList.add('hidden');
        }

        function closeSuccessModal() {
            document.getElementById('success-modal').style.display = 'none';
        }

        // Handle Payment Method Selection (Only shows selected method)
        function selectPaymentMethod(method) {
            document.querySelectorAll('.pay-method-btn').forEach(el => {
                if(el.id !== 'btn-' + method) {
                    el.style.display = 'none';
                }
            });

            let appName = '';
            let borderColor = '';
            if(method === 'bkash') { appName = 'বিকাশ'; borderColor = 'border-pink-500'; }
            if(method === 'nagad') { appName = 'নগদ'; borderColor = 'border-orange-500'; }
            if(method === 'rocket') { appName = 'রকেট'; borderColor = 'border-purple-500'; }

            const selectedBtn = document.getElementById('btn-' + method);
            selectedBtn.classList.remove('border-slate-600', 'bg-slate-800');
            selectedBtn.classList.add(borderColor, 'bg-slate-700');
            
            document.getElementById('selected-app').innerText = appName + " অ্যাপ";
            document.getElementById('payment-details-section').style.display = 'block';
        }

        function copyToClipboard(text, successMessage) {
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById("toast");
                document.getElementById("toast-text").innerText = successMessage;
                toast.className = "show";
                setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
            });
        }

        async function verifyPayment() {
            const phone = document.getElementById('wa-number').value.trim();
            const trxId = document.getElementById('trx-id').value.trim();
            const errorMsg = document.getElementById('error-msg');
            const btn = document.getElementById('verify-btn');

            if (!phone || !trxId) {
                errorMsg.innerText = "দয়া করে হোয়াটসঅ্যাপ নাম্বার এবং TrxID দিন!";
                errorMsg.classList.remove('hidden');
                return;
            }

            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Checking...'; 
            btn.disabled = true;
            errorMsg.classList.add('hidden');

            try {
                const { data, error } = await db.from('payments').select('*').eq('trx_id', trxId);
                
                if (error) throw error;

                if (data && data.length > 0) {
                    const paymentInfo = data[0];
                    
                    if (paymentInfo.is_used) {
                        errorMsg.innerText = "এই TrxID টি আগে ব্যবহার করা হয়েছে!";
                        errorMsg.classList.remove('hidden');
                        btn.innerHTML = '<i class="fas fa-check-circle mr-2"></i> Confirm Order'; btn.disabled = false;
                        return;
                    }
                    
                    if (paymentInfo.amount < PRODUCT_PRICE) {
                        errorMsg.innerText = `টাকার পরিমাণ ভুল! আপনি ৳${paymentInfo.amount} পাঠিয়েছেন।`;
                        errorMsg.classList.remove('hidden');
                        btn.innerHTML = '<i class="fas fa-check-circle mr-2"></i> Confirm Order'; btn.disabled = false;
                        return;
                    }

                    // পেমেন্ট সফল হলে payments টেবিলের is_used true করা এবং কাস্টমারের whatsapp_number সেভ করা
                    const { error: updateError } = await db.from('payments')
                        .update({ is_used: true, whatsapp_number: phone })
                        .eq('trx_id', trxId);

                    if (updateError) throw updateError;

                    // ---------------------------------------------------------
                    // নতুন সংযোজন: পেমেন্ট সফল হওয়ার পর রেন্ডার সার্ভারে রিকোয়েস্ট পাঠিয়ে হোয়াটসঅ্যাপে মেসেজ পাঠানো
                    // ---------------------------------------------------------
                    try {
                        await fetch('https://technography-whatsapp-bot.onrender.com/send-confirmation', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                phone: phone,
                                name: "গ্রাহক",
                                product: "৩,০০,০০০+ AI Reels & Mega Bundle",
                                link: "https://drive.google.com/drive/folders/1X5QrLG4vd1b2Ot2_cW2zkBSZ_I6y3y-k"
                            })
                        });
                    } catch (waErr) {
                        console.log("WhatsApp notification error:", waErr);
                    }

                    if(typeof fbq === 'function') {
                        fbq('track', 'Purchase', { content_name: 'Mega Bundle', value: PRODUCT_PRICE, currency: 'BDT' });
                    }

                    closePaymentModal();
                    document.getElementById('success-modal').style.display = 'flex';
                    
                } else {
                    errorMsg.innerText = "TrxID টি পাওয়া যায়নি! এসএমএস আসতে দেরি হলে ১-২ মিনিট পর আবার কনফার্ম বাটনে ক্লিক করুন।";
                    errorMsg.classList.remove('hidden');
                    btn.innerHTML = '<i class="fas fa-check-circle mr-2"></i> Confirm Order'; btn.disabled = false;
                }

            } catch (err) {
                errorMsg.innerText = "নেটওয়ার্ক সমস্যা! একটু পর চেষ্টা করুন।";
                errorMsg.classList.remove('hidden');
                btn.innerHTML = '<i class="fas fa-check-circle mr-2"></i> Confirm Order'; btn.disabled = false;
            }
        }
    </script>
