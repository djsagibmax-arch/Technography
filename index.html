    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f1f5f9; display: flex; flex-direction: column; min-height: 100vh; margin: 0; padding: 0; overflow-x: hidden; }
        .modal { display: none; background-color: rgba(0,0,0,0.6); backdrop-filter: blur(4px); }
        .modal.active { display: flex; }
        * { -webkit-tap-highlight-color: transparent; }
        .main-content { flex: 1; }
        
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; overflow-x: auto; white-space: nowrap; }
        
        .custom-prose { width: 100%; word-wrap: break-word; overflow-wrap: break-word; }
        .custom-prose * { max-width: 100% !important; } 
        .custom-prose p, .custom-prose div, .custom-prose span { width: auto !important; white-space: normal !important; }
        .custom-prose a { color: #2563eb !important; text-decoration: underline !important; font-weight: bold; word-break: break-all; transition: color 0.2s; }
        .custom-prose a:hover { color: #1d4ed8 !important; }
        .custom-prose strong { font-weight: 800; color: #0f172a; }
        .custom-prose ul { list-style-type: disc !important; margin-left: 2rem !important; margin-bottom: 1rem; }
        .custom-prose ol { list-style-type: decimal !important; margin-left: 2rem !important; margin-bottom: 1rem; }
        .custom-prose img { max-width: 100%; height: auto; border-radius: 8px; margin: 10px 0; content-visibility: auto; }
        .custom-prose iframe { width: 100%; min-height: 350px; border-radius: 8px; margin: 15px 0; }
        
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #4f46e5; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #side-menu { transition: transform 0.3s ease-in-out; }
    </style>

<body class="text-slate-800">

    <!-- Initial Global Loader -->
    <div id="initial-loader" class="fixed inset-0 z-[9999] bg-[#f1f5f9] flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="loader"></div>
        <p class="mt-4 font-extrabold text-indigo-600 text-lg animate-pulse">Loading Technography...</p>
    </div>

    <div id="success-overlay" class="fixed inset-0 z-[100] bg-indigo-900/95 backdrop-blur-sm hidden items-center justify-center">
        <div class="text-center p-10 bg-white rounded-3xl shadow-2xl transform scale-100 transition-all max-w-sm w-full mx-4 border-b-8 border-green-500">
            <div class="w-24 h-24 bg-green-100 text-green-500 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner">
                <i class="fas fa-check-circle text-6xl"></i>
            </div>
            <h2 class="text-3xl font-black text-slate-800 mb-2">Payment Successful!</h2>
            <p class="text-slate-500 font-medium mb-6">Your order has been confirmed. Redirecting to your content...</p>
            <div class="flex justify-center items-center gap-2 text-indigo-600 font-bold text-lg bg-indigo-50 py-3 rounded-xl border border-indigo-100">
                <i class="fas fa-spinner fa-spin"></i> Loading in <span id="countdown" class="text-2xl font-black ml-1">2</span>s
            </div>
        </div>
    </div>

    <!-- Navbars -->
    <nav class="bg-indigo-900 text-white p-2 md:p-3 relative z-40 shadow select-none flex justify-between items-center gap-2">
        <h1 onclick="handleLogoClick()" class="text-sm sm:text-xl md:text-2xl font-extrabold tracking-wider cursor-pointer flex items-center shrink-0">
            <i class="fas fa-layer-group mr-1 sm:mr-2 text-indigo-400"></i>TECHNOGRAPHY
        </h1>
        <div class="flex-1 max-w-xl mx-auto relative" id="nav-search-container">
            <input type="text" id="search-input" onkeyup="searchProducts()" placeholder="Search..." class="w-full pl-8 sm:pl-10 pr-3 py-1.5 md:py-2.5 rounded-full text-slate-800 outline-none focus:ring-2 focus:ring-indigo-400 text-xs sm:text-sm shadow-inner bg-slate-50">
            <i class="fas fa-search absolute left-3 sm:left-3.5 top-2 sm:top-2.5 md:top-3 text-slate-400 text-xs sm:text-sm"></i>
        </div>
        <button onclick="toggleSideMenu()" class="text-white text-2xl sm:text-3xl px-2 focus:outline-none hover:text-indigo-300 transition shrink-0">
            <i class="fas fa-bars"></i>
        </button>
    </nav>

    <div id="secondary-navbar" class="bg-indigo-800 text-white shadow-md flex justify-between sm:justify-center px-1 sm:px-4 py-2 sm:gap-3 z-30 relative select-none w-full hide-scroll">
        <span onclick="openPage('about')" class="cursor-pointer px-1.5 sm:px-4 py-1.5 rounded-full bg-blue-600 hover:bg-blue-500 border border-blue-400 text-[10px] sm:text-sm font-bold shadow-sm transition flex items-center justify-center flex-1 sm:flex-none mx-0.5"><i class="fas fa-info-circle mr-1"></i>About</span>
        <span onclick="openPage('contact')" class="cursor-pointer px-1.5 sm:px-4 py-1.5 rounded-full bg-green-600 hover:bg-green-500 border border-green-400 text-[10px] sm:text-sm font-bold shadow-sm transition flex items-center justify-center flex-1 sm:flex-none mx-0.5"><i class="fas fa-envelope mr-1"></i>Contact</span>
        <span onclick="openPage('privacy')" class="cursor-pointer px-1.5 sm:px-4 py-1.5 rounded-full bg-purple-600 hover:bg-purple-500 border border-purple-400 text-[10px] sm:text-sm font-bold shadow-sm transition flex items-center justify-center flex-1 sm:flex-none mx-0.5"><i class="fas fa-shield-alt mr-1"></i>Privacy</span>
        <span onclick="openPage('terms')" class="cursor-pointer px-1.5 sm:px-4 py-1.5 rounded-full bg-orange-600 hover:bg-orange-500 border border-orange-400 text-[10px] sm:text-sm font-bold shadow-sm transition flex items-center justify-center flex-1 sm:flex-none mx-0.5"><i class="fas fa-file-contract mr-1"></i>Terms</span>
        <span onclick="openPage('dmca')" class="cursor-pointer px-1.5 sm:px-4 py-1.5 rounded-full bg-red-600 hover:bg-red-500 border border-red-400 text-[10px] sm:text-sm font-bold shadow-sm transition flex items-center justify-center flex-1 sm:flex-none mx-0.5"><i class="fas fa-copyright mr-1"></i>DMCA</span>
    </div>

    <!-- Sidebar Menu -->
    <div id="menu-overlay" onclick="toggleSideMenu()" class="fixed inset-0 bg-black bg-opacity-60 z-40 hidden backdrop-blur-sm"></div>
    <div id="side-menu" class="fixed inset-y-0 right-0 w-72 sm:w-80 bg-white text-slate-800 shadow-2xl transform translate-x-full z-50 flex flex-col h-full border-l-4 border-indigo-600">
        <div id="menu-header" class="p-6 bg-gradient-to-r from-indigo-700 to-indigo-900 text-white flex justify-between items-center shadow-md">
            <div id="menu-user-details" class="hidden"><h3 id="menu-user-name" class="font-bold text-lg truncate">User</h3><p class="text-xs text-indigo-200">Welcome to Technography</p></div>

                <button onclick="showAuthPage('signup')" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg shadow-md transition text-sm"><i class="fas fa-user-plus mr-1"></i> Sign Up</button>

                <button onclick="openProfile()" class="w-full flex items-center p-3 hover:bg-indigo-50 rounded-xl transition font-bold text-slate-700 hover:text-indigo-700"><i class="fas fa-user-circle text-indigo-500 text-xl mr-3 w-6 text-center"></i> My Profile</button>
                <button onclick="openMyProducts()" class="w-full flex items-center p-3 hover:bg-green-50 rounded-xl transition font-bold text-slate-700 hover:text-green-700"><i
