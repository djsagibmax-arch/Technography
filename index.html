let displayedCount = 9; // প্রথমে ৯টি রিভিউ লোড হবে

function getStarIcons(rating) {
    let stars = '';
    const fullStars = Math.floor(rating);
    const hasHalf = rating % 1 !== 0;
    for (let i = 0; i < fullStars; i++) stars += '<i class="fa-solid fa-star text-amber-400"></i>';
    if (hasHalf) stars += '<i class="fa-solid fa-star-half-stroke text-amber-400"></i>';
    return stars;
}

function renderReviews() {
    const container = document.getElementById('reviewsContainer');
    
    // লোকাল স্টোরেজে কাস্টমারের দেওয়া রিভিউ থাকলে তাও লোড করবে
    const userReviews = JSON.parse(localStorage.getItem('technography_user_reviews') || '[]');
    const allReviews = [...userReviews, ...INITIAL_REVIEWS];

    container.innerHTML = '';
    const toShow = allReviews.slice(0, displayedCount);

    toShow.forEach(rev => {
        const card = document.createElement('div');
        card.className = "bg-slate-900/80 border border-slate-800/90 rounded-2xl p-4 sm:p-5 flex flex-col justify-between hover:border-slate-700 transition";
        card.innerHTML = `
            <div>
                <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center gap-3">
                        <!-- জিমেইল স্টাইল রঙিন সার্কেল অ্যাভাটার -->
                        <div class="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold text-sm shadow-md" style="background-color: ${rev.color || '#0284c7'}">
                            ${rev.initial || rev.name.charAt(0).toUpperCase()}
                        </div>
                        <div>
                            <div class="text-sm font-bold text-slate-100 flex items-center gap-1.5">
                                ${rev.name}
                                <i class="fa-solid fa-circle-check text-cyan-400 text-xs" title="ভেরিফাইড ক্রেতা"></i>
                            </div>
                            <div class="text-[11px] text-slate-400">${rev.time || 'সদ্য রিভিউ দিয়েছেন'}</div>
                        </div>
                    </div>
                </div>
                <div class="flex items-center gap-1 mb-2 text-xs">
                    ${getStarIcons(rev.rating)}
                </div>
                <p class="text-xs sm:text-sm text-slate-300 leading-relaxed font-normal">
                    "${rev.text}"
                </p>
            </div>
            <div class="mt-4 pt-2.5 border-t border-slate-800/60 flex items-center justify-between text-[11px] text-slate-400">
                <span><i class="fa-solid fa-bag-shopping text-emerald-400 mr-1"></i> ভেরিফাইড ক্রয়</span>
                <span class="text-slate-400">Technography</span>
            </div>
        `;
        container.appendChild(card);
    });

    const loadMoreBtn = document.getElementById('loadMoreRevBtn');
    if (displayedCount >= allReviews.length) {
        loadMoreBtn.style.display = 'none';
    } else {
        loadMoreBtn.style.display = 'inline-flex';
    }
}

function loadMoreReviews() {
    displayedCount += 9;
    renderReviews();
}

// কাস্টমার রিভিউ সাবমিট হ্যান্ডলার
function handleReviewSubmit(e) {
    e.preventDefault();
    const name = document.getElementById('revName').value.trim();
    const rating = parseFloat(document.getElementById('revRating').value);
    const text = document.getElementById('revComment').value.trim();

    if (!name || !text) return;

    const colors = ['#e11d48', '#2563eb', '#059669', '#d97706', '#7c3aed', '#0891b2', '#ea580c', '#db2777'];
    const randomColor = colors[Math.floor(Math.random() * colors.length)];

    const newRev = {
        name: name,
        rating: rating,
        text: text,
        color: randomColor,
        initial: name.charAt(0).toUpperCase(),
        time: 'এইমাত্র'
    };

    const userReviews = JSON.parse(localStorage.getItem('technography_user_reviews') || '[]');
    userReviews.unshift(newRev);
    localStorage.setItem('technography_user_reviews', JSON.stringify(userReviews));

    document.getElementById('userReviewForm').reset();
    alert('ধন্যবাদ! আপনার রিভিউটি সফলভাবে প্রকাশিত হয়েছে।');
    
    displayedCount = 9;
    renderReviews();
}

// পেজ লোড হলে রিভিউ ইনিশিয়ালাইজেশন
document.addEventListener('DOMContentLoaded', () => {
    renderReviews();
});
