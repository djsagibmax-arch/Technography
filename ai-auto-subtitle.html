<script type="module">

/*
=================================================
TRANSFORMERS.JS
Browser AI
=================================================
*/

import {
    pipeline
} from
"https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.0.1";


const videoInput =
document.getElementById("videoInput");

const videoPreview =
document.getElementById("videoPreview");

const fileName =
document.getElementById("fileName");

const aiButton =
document.getElementById("aiButton");

const statusBox =
document.getElementById("status");

const progressBox =
document.getElementById("progressBox");

const progress =
document.getElementById("progress");

const progressText =
document.getElementById("progressText");

const subtitleList =
document.getElementById("subtitleList");

const subtitlePreview =
document.getElementById("subtitlePreview");

const sourceLanguage =
document.getElementById("sourceLanguage");


let videoFile = null;

let subtitles = [];

let transcriber = null;


/*
=================================================
VIDEO UPLOAD
=================================================
*/

videoInput.addEventListener(
"change",
function(){

    videoFile = this.files[0];

    if(!videoFile){
        return;
    }

    fileName.textContent =
    "নির্বাচিত: " +
    videoFile.name;

    const url =
    URL.createObjectURL(videoFile);

    videoPreview.src = url;

    videoPreview.load();

    statusBox.innerHTML =
    "✅ ভিডিও প্রস্তুত। এখন <strong>AI Auto Subtitle</strong> চাপুন।";

});


/*
=================================================
LOAD WHISPER
=================================================
*/

async function loadWhisper(){

    if(transcriber){
        return;
    }

    statusBox.innerHTML =
    "⏳ Whisper AI Model ডাউনলোড হচ্ছে... প্রথমবার কিছুটা সময় লাগতে পারে।";

    progressBox.style.display =
    "block";

    progress.style.width =
    "5%";

    progressText.textContent =
    "AI Model Loading...";


    /*
    multilingual Whisper model

    tiny model ব্যবহার করা হচ্ছে যাতে
    browser/mobile-এ তুলনামূলকভাবে সহজে চলে।
    */

    transcriber =
    await pipeline(
        "automatic-speech-recognition",
        "Xenova/whisper-tiny",
        {

            dtype:"q8",

            progress_callback:
            function(data){

                if(
                    data &&
                    data.progress !== undefined
                ){

                    let p =
                    Math.round(
                        data.progress
                    );

                    if(p > 95){
                        p = 95;
                    }

                    progress.style.width =
                    p + "%";

                    progressText.textContent =
                    "AI Model Download: " +
                    p +
                    "%";

                }

            }

        }
    );


    progress.style.width =
    "100%";

    progressText.textContent =
    "AI Model Ready";

}


/*
=================================================
START AI
=================================================
*/

window.startAI =
async function(){

    if(!videoFile){

        alert(
        "প্রথমে একটি ভিডিও আপলোড করুন।"
        );

        return;
    }


    aiButton.disabled =
    true;


    try{

        await loadWhisper();


        statusBox.innerHTML =
        "🎧 ভিডিওর Audio বিশ্লেষণ করা হচ্ছে...";


        progressBox.style.display =
        "block";


        /*
        Browser-এ video element থেকে
        audio নেওয়ার চেষ্টা।
        */

        const audio =
        await extractAudio(videoFile);


        statusBox.innerHTML =
        "🤖 Whisper AI কথা শনাক্ত করছে...";


        progress.style.width =
        "20%";


        /*
        Whisper transcription
        */

        const selectedLanguage =
        sourceLanguage.value;


        let options = {

            chunk_length_s:30,

            stride_length_s:5,

            return_timestamps:true,

            callback_function:
            function(){

                /*
                কিছু browser-এ callback
                নিয়মিত progress দিতে পারে।
                */

            }

        };


        if(
            selectedLanguage !== "auto"
        ){

            const languageMap = {

                bn:"bengali",

                en:"english",

                hi:"hindi",

                ar:"arabic",

                ur:"urdu",

                es:"spanish",

                fr:"french",

                de:"german",

                ja:"japanese",

                ko:"korean",

                zh:"chinese"

            };


            options.language =
            languageMap[
                selectedLanguage
            ];

        }


        const result =
        await transcriber(
            audio,
            options
        );


        progress.style.width =
        "100%";


        progressText.textContent =
        "Subtitle তৈরি সম্পন্ন";


        /*
        Result থেকে subtitle বানানো
        */

        subtitles = [];


        if(
            result &&
            result.chunks
        ){

            result.chunks.forEach(
            function(chunk){

                if(
                    !chunk.timestamp
                ){
                    return;
                }


                let start =
                chunk.timestamp[0];

                let end =
                chunk.timestamp[1];


                if(
                    start === null ||
                    start === undefined
                ){
                    return;
                }


                if(
                    end === null ||
                    end === undefined
                ){

                    end =
                    start + 2;

                }


                const text =
                (chunk.text || "")
                .trim();


                if(!text){
                    return;
                }


                subtitles.push({

                    start:start,

                    end:end,

                    text:text

                });

            });

        }


        renderSubtitles();


        statusBox.innerHTML =
        "✅ AI Subtitle তৈরি হয়েছে। " +
        subtitles.length +
        "টি subtitle পাওয়া গেছে।";


    }catch(error){

        console.error(error);


        statusBox.innerHTML =
        "❌ AI Processing-এ সমস্যা হয়েছে।";


        alert(
        "AI চালাতে সমস্যা হয়েছে। Browser Console-এ বিস্তারিত Error দেখা যাবে।\n\n" +
        error.message
        );


    }


    aiButton.disabled =
    false;

};


/*
=================================================
AUDIO EXTRACTION
=================================================

Browser-এ ভিডিওর audio track থেকে
Float32 PCM বানানোর চেষ্টা।

=================================================
*/

async function extractAudio(file){

    const arrayBuffer =
    await file.arrayBuffer();


    const audioContext =
    new (
        window.AudioContext ||
        window.webkitAudioContext
    )();


    const audioBuffer =
    await audioContext.decodeAudioData(
        arrayBuffer
    );


    /*
    Whisper সাধারণত 16kHz audio চায়।
    */

    const targetRate =
    16000;


    const offline =
    new OfflineAudioContext(
        1,
        Math.ceil(
            audioBuffer.duration *
            targetRate
        ),
        targetRate
    );


    const source =
    offline.createBufferSource();


    source.buffer =
    audioBuffer;


    source.connect(
        offline.destination
    );


    source.start();


    const rendered =
    await offline.startRendering();


    const channel =
    rendered.getChannelData(0);


    return channel;

}


/*
=================================================
RENDER SUBTITLES
=================================================
*/

function renderSubtitles(){

    subtitleList.innerHTML = "";


    if(subtitles.length === 0){

        subtitleList.innerHTML =
        `
        <div class="notice">
        কোনো Subtitle পাওয়া যায়নি।
        </div>
        `;

        return;

    }


    subtitles.forEach(
    function(sub,index){

        const item =
        document.createElement("div");

        item.className =
        "sub-item";


        item.innerHTML =
        `
        <div class="sub-time">
        #${index + 1}
        &nbsp;
        ${formatTime(sub.start)}
        →
        ${formatTime(sub.end)}
        </div>

        <div class="sub-text">
        ${escapeHTML(sub.text)}
        </div>
        `;


        subtitleList.appendChild(item);

    });

}


/*
=================================================
SHOW ACTIVE SUBTITLE
=================================================
*/

videoPreview.addEventListener(
"timeupdate",
function(){

    const current =
    videoPreview.currentTime;


    const active =
    subtitles.find(
        function(sub){

            return (
                current >= sub.start &&
                current <= sub.end
            );

        }
    );


    if(active){

        subtitlePreview.textContent =
        active.text;

    }else{

        subtitlePreview.textContent =
        "";

    }

});


/*
=================================================
TIME FORMAT
=================================================
*/

function formatTime(seconds){

    const total =
    Math.max(
        0,
        Math.floor(seconds)
    );


    const hours =
    Math.floor(
        total / 3600
    );


    const minutes =
    Math.floor(
        (total % 3600) / 60
    );


    const secs =
    total % 60;


    if(hours > 0){

        return (
            String(hours).padStart(2,"0") +
            ":" +
            String(minutes).padStart(2,"0") +
            ":" +
            String(secs).padStart(2,"0")
        );

    }


    return (
        String(minutes).padStart(2,"0") +
        ":" +
        String(secs).padStart(2,"0")
    );

}


/*
=================================================
HTML SECURITY
=================================================
*/

function escapeHTML(text){

    return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/*
=================================================
CLEAR
=================================================
*/

window.clearAll =
function(){

    subtitles = [];

    videoFile = null;

    videoInput.value = "";

    videoPreview.removeAttribute(
        "src"
    );

    videoPreview.load();

    fileName.textContent = "";

    subtitlePreview.textContent = "";

    subtitleList.innerHTML =
    `
    <div class="notice">
    ভিডিও আপলোড করে
    <strong>AI Auto Subtitle</strong>
    চাপুন।
    </div>
    `;

    statusBox.innerHTML =
    "AI Engine এখনো চালু করা হয়নি।";

    progressBox.style.display =
    "none";

};

</script>
