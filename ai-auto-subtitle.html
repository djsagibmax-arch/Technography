<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>AI Auto Subtitle | Technography</title>
    <meta name="description" content="Technography AI Auto Subtitle Generator - ভিডিও থেকে দ্রুত ও স্বয়ংক্রিয়ভাবে সাবটাইটেল তৈরি করুন।">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at 10% 0%, rgba(236,72,153,.14), transparent 32%),
                        radial-gradient(circle at 90% 100%, rgba(139,92,246,.14), transparent 35%),
                        #030712;
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .glass {
            background: rgba(15,23,42,.85);
            border: 1px solid rgba(148,163,184,.14);
            backdrop-filter: blur(14px);
        }
        .glow { box-shadow: 0 0 30px rgba(236,72,153,.15); }
        .upload-box {
            border: 2px dashed rgba(236,72,153,.45);
            transition: .25s ease;
        }
        .upload-box:hover {
            border-color: #ec4899;
            background: rgba(236,72,153,.05);
        }
        video {
            width: 100%;
            max-height: 480px;
            background: #000;
            border-radius: 16px;
        }
        .subtitle-item {
            background: rgba(15,23,42,.85);
            border: 1px solid rgba(148,163,184,.12);
            border-radius: 12px;
            padding: 12px;
            cursor: pointer;
            transition: .2s;
        }
        .subtitle-item:hover, .subtitle-item.active {
            border-color: #ec4899;
            background: rgba(236,72,153,.1);
        }
        .subtitle-overlay {
            position: absolute;
            left: 15px;
            right: 15px;
            bottom: 45px;
            text-align: center;
            pointer-events: none;
        }
        .subtitle-overlay span {
            display: inline-block;
            max-width: 90%;
            padding: 6px 12px;
            border-radius: 8px;
            background: rgba(0,0,0,.8);
            color: #fff;
            font-weight: bold;
            font-size: clamp(14px, 3.5vw, 22px);
            text-shadow: 0 1px 3px #000;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .spinner { animation: spin 1s linear infinite; }
    </style>
</head>

<body>

<!-- হেডার -->
<header class="sticky top-0 z-50 bg-slate-950/90 backdrop-blur-xl border-b border-slate-800">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
        <a href="index.html" class="font-black text-lg sm:text-xl">
            <span class="text-pink-400">TECHNO</span><span class="text-white">GRAPHY</span>
        </a>
        <a href="index.html" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-full text-xs font-semibold">
            <i class="fa-solid fa-house mr-1"></i> Home
        </a>
    </div>
</header>

<main class="max-w-4xl mx-auto px-4 py-8">

    <div class="text-center mb-8">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-pink-500/10 border border-pink-500/20 text-pink-300 text-xs font-bold mb-3">
            <i class="fa-solid fa-bolt"></i> ফাস্ট ও সরাসরি AI সাবটাইটেল
        </div>
        <h1 class="text-3xl sm:text-4xl font-black mb-3">AI Auto Subtitle</h1>
        <p class="text-slate-400 text-xs sm:text-sm">
            ভিডিও আপলোড করে প্লে করুন। কথা শনাক্ত হয়ে খাঁটি বাংলায় সাবটাইটেল তৈরি হবে।
        </p>
    </div>

    <!-- ভাষা নির্বাচন ও আপলোড বক্স -->
    <div class="glass glow rounded-2xl p-6 sm:p-8 mb-6 text-center">
        <div class="max-w-xs mx-auto mb-5 text-left">
            <label class="block text-xs font-bold text-slate-300 mb-1.5">ভিডিওর ভাষা নির্বাচন করুন:</label>
            <select id="langSelect" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-pink-500">
                <option value="bn-BD">বাংলা (Bengali)</option>
                <option value="en-US">English</option>
                <option value="hi-IN">Hindi</option>
            </select>
        </div>

        <label for="videoInput" class="upload-box rounded-2xl p-8 flex flex-col items-center justify-center cursor-pointer">
            <div class="w-16 h-16 rounded-full bg-pink-500/10 flex items-center justify-center text-pink-400 text-3xl mb-3">
                <i class="fa-solid fa-cloud-arrow-up"></i>
            </div>
            <h2 class="text-lg font-bold mb-1">ভিডিও সিলেক্ট করুন</h2>
            <p class="text-slate-400 text-xs mb-4">MP4, WebM, MOV ইত্যাদি</p>
            <span class="bg-pink-600 hover:bg-pink-500 px-5 py-2.5 rounded-xl font-bold text-xs flex items-center gap-2 shadow-lg">
                <i class="fa-solid fa-video"></i> ফাইল বেছে নিন
            </span>
            <input id="videoInput" type="file" accept="video/*" class="hidden">
        </label>
    </div>

    <!-- প্রিভিউ এবং প্রসেসিং সেকশন -->
    <div id="previewArea" class="hidden glass rounded-2xl p-4 sm:p-6 mb-6 space-y-4">
        <div class="relative overflow-hidden rounded-xl">
            <video id="videoElement" controls playsinline></video>
            <div class="subtitle-overlay">
                <span id="activeSubtitleText" class="hidden"></span>
            </div>
        </div>

        <button id="startProcessBtn" type="button" class="w-full bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 text-white font-bold py-3.5 rounded-xl text-sm shadow-xl flex items-center justify-center gap-2 transition">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <span>সাবটাইটেল তৈরি শুরু করুন</span>
        </button>

        <div id="statusInfo" class="hidden bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-pink-300 flex items-center justify-center gap-2">
            <i class="fa-solid fa-circle-notch spinner text-sm"></i>
            <span id="statusMessage">AI অডিও ট্র্যাক বিশ্লেষণ করে কথা শুনছে...</span>
        </div>
    </div>

    <!-- রেজাল্ট সেকশন -->
    <div id="resultArea" class="hidden glass rounded-2xl p-5 mb-6 space-y-4">
        <div class="flex items-center justify-between">
            <h3 class="text-base font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-closed-captioning text-pink-400"></i>
                <span>Generated Subtitles</span>
            </h3>
            <button id="downloadBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5">
                <i class="fa-solid fa-download"></i> SRT ডাউনলোড
            </button>
        </div>

        <div id="subtitlesList" class="space-y-2 max-h-72 overflow-y-auto pr-1"></div>
    </div>

</main>

<script>
const videoInput = document.getElementById('videoInput');
const langSelect = document.getElementById('langSelect');
const previewArea = document.getElementById('previewArea');
const videoElement = document.getElementById('videoElement');
const startProcessBtn = document.getElementById('startProcessBtn');
const statusInfo = document.getElementById('statusInfo');
const statusMessage = document.getElementById('statusMessage');
const resultArea = document.getElementById('resultArea');
const subtitlesList = document.getElementById('subtitlesList');
const activeSubtitleText = document.getElementById('activeSubtitleText');
const downloadBtn = document.getElementById('downloadBtn');

let subtitlesData = [];
let recognition = null;

videoInput.addEventListener('change', function(e) {
    const file = this.files[0];
    if (!file) return;

    videoElement.src = URL.createObjectURL(file);
    previewArea.classList.remove('hidden');
    resultArea.classList.add('hidden');
    subtitlesData = [];
});

startProcessBtn.addEventListener('click', async function() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        alert("⚠️ আপনার ব্রাউজারে স্পিচ রিকগনিশন সাপোর্ট নেই। দয়া করে গুগল ক্রোম (Google Chrome) ব্রাউজারে চেষ্টা করুন।");
        return;
    }

    startProcessBtn.disabled = true;
    startProcessBtn.classList.add('opacity-50');
    statusInfo.classList.remove('hidden');
    statusMessage.textContent = "কথা শনাক্ত হচ্ছে (ভিডিওর সাউন্ড স্পষ্ট থাকতে হবে)...";

    // স্পিচ ইঞ্জিন শুরু
    recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = langSelect.value;

    subtitlesData = [];
    videoElement.currentTime = 0;
    videoElement.muted = false;

    let segmentStart = 0;

    recognition.onresult = function(event) {
        for (let i = event.resultIndex; i < event.results.length; ++i) {
            const transcript = event.results[i][0].transcript.trim();
            const currentTime = videoElement.currentTime;

            if (event.results[i].isFinal && transcript) {
                subtitlesData.push({
                    start: Math.max(0, segmentStart),
                    end: Math.max(segmentStart + 1.2, currentTime),
                    text: transcript
                });
                segmentStart = currentTime;
                renderSubtitles();
                resultArea.classList.remove('hidden');
            }
        }
    };

    recognition.onerror = function(err) {
        console.warn("Speech recognition notice:", err.error);
        if (err.error === 'not-allowed') {
            alert("⚠️ দয়া করে ব্রাউজারে মাইক্রোফোন পারমিশন এলাউ (Allow) করুন যাতে ভিডিওর অডিও ডিটেক্ট হতে পারে।");
        }
    };

    recognition.onend = function() {
        if (!videoElement.ended && !videoElement.paused) {
            try { recognition.start(); } catch(e) {}
        } else {
            startProcessBtn.disabled = false;
            startProcessBtn.classList.remove('opacity-50');
            statusInfo.classList.add('hidden');
            if (subtitlesData.length > 0) resultArea.classList.remove('hidden');
        }
    };

    try {
        await videoElement.play();
        recognition.start();
    } catch (e) {
        console.error(e);
    }

    videoElement.onended = function() {
        try { recognition.stop(); } catch(e) {}
        statusMessage.textContent = "সাবটাইটেল তৈরি সম্পন্ন!";
        setTimeout(() => statusInfo.classList.add('hidden'), 1000);
    };
});

function formatTime(sec) {
    const m = Math.floor(sec / 60).toString().padStart(2, '0');
    const s = Math.floor(sec % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
}

function formatSRTTime(seconds) {
    const h = Math.floor(seconds / 3600).toString().padStart(2, '0');
    const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
    const s = Math.floor(seconds % 60).toString().padStart(2, '0');
    const ms = Math.floor((seconds % 1) * 1000).toString().padStart(3, '0');
    return `${h}:${m}:${s},${ms}`;
}

function renderSubtitles() {
    subtitlesList.innerHTML = '';
    subtitlesData.forEach((sub, i) => {
        const item = document.createElement('div');
        item.className = "subtitle-item flex items-center justify-between text-xs";
        item.innerHTML = `
            <span class="text-pink-400 font-bold">${formatTime(sub.start)}</span>
            <span class="text-slate-200 flex-1 ml-3">${sub.text}</span>
        `;
        item.onclick = () => { videoElement.currentTime = sub.start; videoElement.play(); };
        subtitlesList.appendChild(item);
    });
}

videoElement.addEventListener('timeupdate', function() {
    const cur = videoElement.currentTime;
    const active = subtitlesData.find(s => cur >= s.start && cur <= s.end);

    if (active) {
        activeSubtitleText.textContent = active.text;
        activeSubtitleText.classList.remove('hidden');
    } else {
        activeSubtitleText.classList.add('hidden');
    }
});

downloadBtn.addEventListener('click', function() {
    if (subtitlesData.length === 0) return;

    let srtText = "";
    subtitlesData.forEach((sub, i) => {
        srtText += `${i + 1}\n${formatSRTTime(sub.start)} --> ${formatSRTTime(sub.end)}\n${sub.text}\n\n`;
    });

    const blob = new Blob([srtText], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = "technography-subtitles.srt";
    a.click();
    URL.revokeObjectURL(url);
});
</script>

</body>
</html>
