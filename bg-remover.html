<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Background Remover | Technography</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background-color: #030712;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .neon-card {
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid rgba(34, 211, 238, 0.25);
      box-shadow: 0 10px 35px -5px rgba(0, 0, 0, 0.8), 0 0 25px rgba(6, 182, 212, 0.15);
    }
    .checkered-bg {
      background: repeating-conic-gradient(#1f2937 0% 25%, #111827 0% 50%) 50% / 20px 20px;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
    .spinner {
      animation: spin 1s linear infinite;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <!-- হেডার -->
  <header class="sticky top-0 z-50 backdrop-blur-md bg-slate-900/90 border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="index.html" class="text-xl font-bold tracking-wider text-cyan-400 no-underline">
        Technography
      </a>
      <a href="index.html" class="text-xs sm:text-sm text-slate-400 hover:text-white flex items-center gap-1.5 transition">
        <i class="fa-solid fa-arrow-left"></i> হোমপেজে ফিরুন
      </a>
    </div>
  </header>

  <!-- মূল কন্টেইনার -->
  <main class="flex-1 flex items-center justify-center px-4 py-8">
    <div class="neon-card w-full max-w-lg rounded-3xl p-6 sm:p-8 text-center relative overflow-hidden">
      
      <!-- হেডিং -->
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-cyan-500/10 border border-cyan-400/30 text-cyan-300 text-xs font-bold mb-3">
        <i class="fa-solid fa-wand-magic-sparkles text-cyan-400"></i>
        <span>১০০% ফ্রি ও আনলিমিটেড BEN2 AI</span>
      </div>
      <h1 class="text-2xl sm:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 mb-2">
        AI ব্যাকগ্রাউন্ড রিমুভার
      </h1>
      <p class="text-xs sm:text-sm text-slate-400 mb-6">
        যেকোনো ছবির ব্যাকগ্রাউন্ড মাত্র ১ ক্লিকে নিখুঁতভাবে রিমুভ করে স্বচ্ছ PNG ডাউনলোড করুন
      </p>

      <!-- ছবি আপলোড বক্স -->
      <label for="imageInput" class="group block border-2 border-dashed border-cyan-500/40 hover:border-cyan-400 bg-slate-950/60 rounded-2xl p-6 cursor-pointer transition">
        <div class="w-16 h-16 mx-auto rounded-full bg-cyan-950/50 border border-cyan-500/30 flex items-center justify-center text-cyan-400 text-2xl group-hover:scale-110 transition mb-3">
          <i class="fa-solid fa-cloud-arrow-up"></i>
        </div>
        <span class="block text-sm font-bold text-slate-200 group-hover:text-cyan-300 transition">
          গ্যালারি থেকে ছবি সিলেক্ট করুন
        </span>
        <span class="block text-xs text-slate-500 mt-1">
          JPG, PNG, WebP ছবি সাপোর্টেড
        </span>
      </label>
      <input type="file" id="imageInput" accept="image/*" class="hidden">

      <!-- অ্যাকশন এরিয়া -->
      <div id="actionArea" class="hidden mt-6 space-y-4">
        <div class="flex items-center justify-center gap-3 bg-slate-900 border border-slate-800 p-2.5 rounded-2xl">
          <img id="sourceThumb" src="" class="w-14 h-14 object-cover rounded-xl border border-slate-700" alt="Selected">
          <div class="text-left flex-1 min-w-0">
            <p id="fileName" class="text-xs font-bold text-slate-200 truncate">photo.png</p>
            <p class="text-[11px] text-emerald-400 font-semibold flex items-center gap-1">
              <i class="fa-solid fa-circle-check"></i> ছবি নির্বাচন সফল
            </p>
          </div>
          <button onclick="resetApp()" class="text-xs text-red-400 hover:text-red-300 p-2">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        </div>

        <button id="processBtn" onclick="startBgRemoval()" class="w-full bg-gradient-to-r from-cyan-500 via-teal-500 to-blue-600 hover:opacity-95 text-white font-bold py-3.5 px-4 rounded-xl text-sm shadow-lg flex items-center justify-center gap-2 transition active:scale-95">
          <i class="fa-solid fa-scissors"></i>
          <span>ম্যাজিক ব্যাকগ্রাউন্ড রিমুভ করুন</span>
        </button>
      </div>

      <!-- স্ট্যাটাস লোডার -->
      <div id="statusBox" class="hidden mt-4 text-xs font-semibold text-cyan-300 flex items-center justify-center gap-2">
        <i class="fa-solid fa-circle-notch spinner text-base"></i>
        <span id="statusText">BEN2 AI লোড হচ্ছে...</span>
      </div>

      <!-- রেজাল্ট ও ডাউনলোড -->
      <div id="resultArea" class="hidden mt-6 flex-col items-center gap-4">
        <div class="w-full max-h-72 rounded-2xl overflow-hidden border border-slate-700 checkered-bg flex items-center justify-center p-2">
          <canvas id="outputCanvas" class="max-h-64 object-contain rounded-lg"></canvas>
        </div>
        <a id="downloadLink" href="#" download="technography_cutout.png" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-bold py-3.5 px-4 rounded-xl text-sm shadow-xl flex items-center justify-center gap-2 transition">
          <i class="fa-solid fa-download"></i>
          <span>স্বচ্ছ ছবি ডাউনলোড করুন (PNG)</span>
        </a>
      </div>

    </div>
  </main>

  <footer class="bg-slate-950 border-t border-slate-800 py-4 text-center text-slate-500 text-xs">
    <p>&copy; 2026 Technography. All rights reserved.</p>
  </footer>

  <!-- BEN2 AI ইঞ্জিন স্ক্রিপ্ট -->
  <script type="module">
    import { pipeline, env } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.3.3";
    env.allowLocalModels = false;

    let segmenter = null;
    let selectedFile = null;

    const fileInput = document.getElementById("imageInput");
    const actionArea = document.getElementById("actionArea");
    const sourceThumb = document.getElementById("sourceThumb");
    const fileName = document.getElementById("fileName");
    const statusBox = document.getElementById("statusBox");
    const statusText = document.getElementById("statusText");
    const resultArea = document.getElementById("resultArea");
    const outputCanvas = document.getElementById("outputCanvas");
    const downloadLink = document.getElementById("downloadLink");
    const processBtn = document.getElementById("processBtn");

    fileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      selectedFile = file;
      sourceThumb.src = URL.createObjectURL(file);
      fileName.textContent = file.name;

      actionArea.classList.remove("hidden");
      resultArea.classList.add("hidden");
      statusBox.classList.add("hidden");
    });

    window.resetApp = function() {
      fileInput.value = "";
      selectedFile = null;
      actionArea.classList.add("hidden");
      resultArea.classList.add("hidden");
      statusBox.classList.add("hidden");
    };

    window.startBgRemoval = async function() {
      if (!selectedFile) return;

      processBtn.disabled = true;
      processBtn.classList.add("opacity-50", "cursor-not-allowed");
      statusBox.classList.remove("hidden");
      statusText.textContent = "BEN2 AI মডেল লোড হচ্ছে (প্রথমবার একটু সময় নিতে পারে)...";

      try {
        if (!segmenter) {
          // আপনার স্ক্রিনশটের ৪ নম্বরে উল্লেখিত BEN2 মডেল
          segmenter = await pipeline("image-segmentation", "onnx-community/BEN2-ONNX", {
            device: "wasm"
          });
        }

        statusText.textContent = "সূক্ষ্মভাবে ব্যাকগ্রাউন্ড অপসারণ চলছে...";
        const imageUrl = URL.createObjectURL(selectedFile);
        const output = await segmenter(imageUrl);

        // ক্যানভাসে স্বচ্ছ ছবি প্রস্তুত
        const maskCanvas = output[0].mask.toCanvas();
        const ctx = outputCanvas.getContext("2d");
        const originalImg = new Image();

        originalImg.onload = () => {
          outputCanvas.width = originalImg.naturalWidth;
          outputCanvas.height = originalImg.naturalHeight;

          // ড্র মাস্ক
          ctx.drawImage(maskCanvas, 0, 0, outputCanvas.width, outputCanvas.height);
          ctx.globalCompositeOperation = "source-in";
          ctx.drawImage(originalImg, 0, 0);

          // ডাউনলোড লিঙ্ক তৈরি
          outputCanvas.toBlob((blob) => {
            const finalUrl = URL.createObjectURL(blob);
            downloadLink.href = finalUrl;
            statusBox.classList.add("hidden");
            resultArea.classList.remove("hidden");
            resultArea.classList.add("flex");
          }, "image/png");
        };
        originalImg.src = imageUrl;

      } catch (err) {
        console.error(err);
        statusText.textContent = "❌ সমস্যা হয়েছে: " + err.message;
      } finally {
        processBtn.disabled = false;
        processBtn.classList.remove("opacity-50", "cursor-not-allowed");
      }
    };
  </script>

</body>
</html>
