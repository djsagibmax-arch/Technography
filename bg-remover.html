<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Background Remover - Technography</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #030712; color: #f3f4f6; min-height: 100vh; display: flex; flex-direction: column; }
    
    header { background: #0f172a; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; }
    .brand { font-size: 20px; font-weight: bold; color: #22d3ee; text-decoration: none; }
    .back-btn { color: #94a3b8; text-decoration: none; font-size: 14px; display: flex; align-items: center; gap: 6px; }
    .back-btn:hover { color: #fff; }

    .container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 30px 15px; }
    .card { background: #111827; border: 1px solid #1f2937; width: 100%; max-width: 550px; border-radius: 20px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); text-align: center; }
    
    h2 { color: #22d3ee; margin-bottom: 8px; font-size: 22px; font-weight: 800; }
    p.subtitle { color: #9ca3af; font-size: 13px; margin-bottom: 20px; }

    /* সরাসরি ক্লিকযোগ্য ফাইল আপলোড লেবেল */
    .upload-label { 
      border: 2px dashed #06b6d4; 
      border-radius: 16px; 
      padding: 35px 20px; 
      cursor: pointer; 
      background: #0b0f19; 
      display: block;
      transition: 0.3s;
    }
    .upload-label:hover { background: #0f172a; border-color: #22d3ee; }
    .upload-label i { font-size: 42px; color: #22d3ee; margin-bottom: 12px; }
    .upload-label p { font-size: 14px; color: #e2e8f0; font-weight: 600; }
    .upload-label span { font-size: 11px; color: #94a3b8; display: block; margin-top: 5px; }

    /* লুকানো ইনপুট */
    #imageInput { display: none; }

    .preview-container { display: none; margin-top: 20px; flex-direction: column; align-items: center; gap: 15px; }
    .img-box { position: relative; max-width: 100%; max-height: 300px; border-radius: 12px; overflow: hidden; border: 1px solid #374151; background: repeating-conic-gradient(#1f2937 0% 25%, #111827 0% 50%) 50% / 20px 20px; }
    .img-box img { max-width: 100%; max-height: 300px; display: block; object-fit: contain; }

    .btn-action { width: 100%; padding: 14px; border-radius: 12px; border: none; background: linear-gradient(135deg, #06b6d4, #2563eb); color: #fff; font-size: 14px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
    
    #statusMsg { font-size: 13px; color: #22d3ee; margin-top: 15px; font-weight: 500; min-height: 20px; }
    .spinner { display: inline-block; animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="brand">Technography</a>
    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> হোমপেজে ফিরুন</a>
  </header>

  <div class="container">
    <div class="card">
      <h2><i class="fa-solid fa-scissors"></i> AI ব্যাকগ্রাউন্ড রিমুভার</h2>
      <p class="subtitle">১ ক্লিকে ছবির ব্যাকগ্রাউন্ড সম্পূর্ণ ফ্রিতে স্বচ্ছ (Transparent) করুন</p>

      <!-- সরাসরি লেবেলে ইনপুট绑定 করায় মোবাইলে সবসময় কাজ করবে -->
      <label for="imageInput" class="upload-label">
        <i class="fa-solid fa-cloud-arrow-up"></i>
        <p>ছবি নির্বাচন করতে এখানে চাপ দিন</p>
        <span>(JPG, PNG, WebP ফরম্যাট)</span>
      </label>
      <input type="file" id="imageInput" accept="image/*">

      <div id="statusMsg"></div>

      <div class="preview-container" id="previewArea">
        <div class="img-box">
          <img id="resultImage" src="" alt="Processed Image">
        </div>
        <a id="downloadBtn" class="btn-action" href="#" download="transparent_image.png">
          <i class="fa-solid fa-download"></i> স্বচ্ছ PNG ছবি ডাউনলোড করুন
        </a>
      </div>
    </div>
  </div>

  <script type="module">
    import { pipeline, env } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.3.3";

    // ব্রাউজারে লোকাল রানটাইম নিশ্চিত করা
    env.allowLocalModels = false;

    const fileInput = document.getElementById("imageInput");
    const status = document.getElementById("statusMsg");
    const previewArea = document.getElementById("previewArea");
    const resultImg = document.getElementById("resultImage");
    const downloadBtn = document.getElementById("downloadBtn");

    let segmenter = null;

    fileInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      previewArea.style.display = "none";
      status.innerHTML = `<i class="fa-solid fa-circle-notch spinner"></i> এআই মডেল প্রস্তুত হচ্ছে (প্রথমবার একটু সময় নিতে পারে)...`;

      try {
        // লাইটওয়েট ও ফাস্ট ব্যাকগ্রাউন্ড রিমুভার মডেল
        if (!segmenter) {
          status.innerHTML = `<i class="fa-solid fa-circle-notch spinner"></i> লাইটওয়েট এআই লোড হচ্ছে...`;
          segmenter = await pipeline("image-segmentation", "briaai/RMBG-1.4", {
            device: "wasm"
          });
        }

        status.innerHTML = `<i class="fa-solid fa-circle-notch spinner"></i> ব্যাকগ্রাউন্ড প্রসেসিং চলছে...`;

        const imageURL = URL.createObjectURL(file);
        const output = await segmenter(imageURL);

        // ট্রান্সপারেন্ট ক্যানভাস থেকে ছবি তৈরি
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        const img = new Image();

        img.onload = () => {
          canvas.width = img.naturalWidth;
          canvas.height = img.naturalHeight;
          ctx.drawImage(img, 0, 0);

          canvas.toBlob((blob) => {
            const finalUrl = URL.createObjectURL(blob);
            resultImg.src = finalUrl;
            downloadBtn.href = finalUrl;

            status.innerHTML = "✅ ব্যাকগ্রাউন্ড সফলভাবে স্বচ্ছ করা হয়েছে!";
            previewArea.style.display = "flex";
          }, "image/png");
        };

        // আউটপুট মাস্ক যুক্ত করা
        const maskImg = new Image();
        maskImg.onload = () => {
          canvas.width = maskImg.width;
          canvas.height = maskImg.height;
          ctx.drawImage(maskImg, 0, 0);
          ctx.globalCompositeOperation = "source-in";
          ctx.drawImage(img, 0, 0);
        };
        
        // আউটপুট ইমেজ নেওয়া
        const resultMask = output[0].mask;
        const maskCanvas = document.createElement("canvas");
        maskCanvas.width = resultMask.width;
        maskCanvas.height = resultMask.height;
        const maskCtx = maskCanvas.getContext("2d");
        const imgData = maskCtx.createImageData(resultMask.width, resultMask.height);
        
        // কালার বাইট সেট করা
        for (let i = 0; i < resultMask.data.length; i++) {
          const alpha = resultMask.data[i];
          imgData.data[i * 4] = 0;
          imgData.data[i * 4 + 1] = 0;
          imgData.data[i * 4 + 2] = 0;
          imgData.data[i * 4 + 3] = alpha;
        }
        
        // রেন্ডার রেজাল্ট
        resultImg.src = output[0].blob ? URL.createObjectURL(output[0].blob) : imageURL;
        downloadBtn.href = resultImg.src;
        status.innerHTML = "✅ ব্যাকগ্রাউন্ড সফলভাবে সরানো হয়েছে!";
        previewArea.style.display = "flex";

      } catch (err) {
        console.error(err);
        status.innerText = "❌ সমস্যা হয়েছে: " + err.message;
      }
    });
  </script>

</body>
</html>
