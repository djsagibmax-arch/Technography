<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Generator | Technography</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-dark: #0b0f19;
            --card-bg: #151d30;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #263352;
            --accent: #06b6d4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', 'Hind Siliguri', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(21, 29, 48, 0.8);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo span {
            color: var(--primary);
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .back-link:hover { color: #fff; }

        .main-container {
            max-width: 1100px;
            margin: 25px auto;
            padding: 0 15px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            flex: 1;
        }

        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
                margin: 15px auto;
            }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--accent);
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        textarea {
            width: 100%;
            height: 120px;
            background: #0d1322;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            transition: border 0.3s;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        .row-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        select {
            width: 100%;
            background: #0d1322;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            color: #fff;
            outline: none;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .btn-generate {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: opacity 0.3s;
        }

        .btn-generate:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .preview-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0d1322;
            border: 2px dashed var(--border-color);
            border-radius: 10px;
            min-height: 320px;
            position: relative;
            overflow: hidden;
        }

        .placeholder-text {
            color: var(--text-muted);
            text-align: center;
            font-size: 0.9rem;
            padding: 15px;
        }

        .placeholder-text i {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--border-color);
            display: block;
        }

        .generated-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
            border-radius: 6px;
        }

        .loader {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            color: var(--accent);
            text-align: center;
            padding: 15px;
        }

        .spinner {
            width: 42px;
            height: 42px;
            border: 3px solid rgba(6, 182, 212, 0.2);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-download {
            margin-top: 15px;
            background: #10b981;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            font-weight: 600;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            border: none;
        }

        .btn-download:hover {
            background: #059669;
        }

        footer {
            text-align: center;
            padding: 15px;
            color: var(--text-muted);
            font-size: 0.8rem;
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">
            <i class="fa-solid fa-wand-magic-sparkles"></i> Technography <span>AI</span>
        </a>
        <a href="index.html" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> হোমপেজে ফিরুন
        </a>
    </header>

    <div class="main-container">
        <!-- Control Card -->
        <div class="card">
            <h2><i class="fa-solid fa-sliders"></i> ইমেজ কনফিগারেশন</h2>
            
            <div class="input-group">
                <label for="promptInput">ছবির প্রম্পট লিখুন (ইংরেজি বা বাংলা):</label>
                <textarea id="promptInput" placeholder="A futuristic city in Bangladesh, ultra realistic 8k..."></textarea>
            </div>

            <div class="row-options">
                <div>
                    <label for="imageStyle">স্টাইল বেছে নিন:</label>
                    <select id="imageStyle">
                        <option value="" selected>Default (স্বাভাবিক)</option>
                        <option value=", highly realistic, 8k photograph, cinematic lighting">Realism Ultra (বাস্তবসম্মত)</option>
                        <option value=", modern anime style, makoto shinkai visual, highly detailed art">Anime Art (অ্যানিমে)</option>
                        <option value=", 3d render, blender octane render, smooth 3d character">3D Render (থ্রিডি)</option>
                        <option value=", cyberpunk style, neon glowing lights, futuristic">Cyberpunk (সাইবারপাঙ্ক)</option>
                    </select>
                </div>
                <div>
                    <label for="aspectRatio">রেশিও:</label>
                    <select id="aspectRatio">
                        <option value="1024x1024" selected>Square (1:1)</option>
                        <option value="1280x720">Landscape (16:9)</option>
                        <option value="720x1280">Reels / Shorts (9:16)</option>
                    </select>
                </div>
            </div>

            <button id="generateBtn" class="btn-generate">
                <i class="fa-solid fa-bolt"></i> ছবি তৈরি করুন
            </button>
        </div>

        <!-- Output Card -->
        <div class="card">
            <h2><i class="fa-solid fa-image"></i> আউটপুট রেজাল্ট</h2>
            <div class="preview-box">
                <div class="placeholder-text" id="placeholder">
                    <i class="fa-regular fa-images"></i>
                    প্রম্পট লিখে 'ছবি তৈরি করুন' বাটনে চাপ দিন
                </div>

                <div class="loader" id="loader">
                    <div class="spinner"></div>
                    <p id="loaderText">AI ছবি তৈরি করছে, ১০-১৫ সেকেন্ড সময় লাগতে পারে...</p>
                </div>

                <img id="outputImg" class="generated-image" alt="Generated Output">
            </div>

            <button id="downloadBtn" class="btn-download" onclick="downloadImage()">
                <i class="fa-solid fa-download"></i> ছবি ডাউনলোড করুন
            </button>
        </div>
    </div>

    <footer>
        &copy; 2026 Technography AI. সর্বস্বত্ব সংরক্ষিত।
    </footer>

    <script>
        const generateBtn = document.getElementById('generateBtn');
        const promptInput = document.getElementById('promptInput');
        const imageStyle = document.getElementById('imageStyle');
        const aspectRatio = document.getElementById('aspectRatio');
        const outputImg = document.getElementById('outputImg');
        const placeholder = document.getElementById('placeholder');
        const loader = document.getElementById('loader');
        const downloadBtn = document.getElementById('downloadBtn');

        let currentImageBlobUrl = null;

        generateBtn.addEventListener('click', async () => {
            const rawPrompt = promptInput.value.trim();
            if (!rawPrompt) {
                alert("দয়া করে একটি প্রম্পট লিখুন!");
                return;
            }

            // বাটন ও লোডার স্টেট হ্যান্ডলিং
            generateBtn.disabled = true;
            placeholder.style.display = 'none';
            outputImg.style.display = 'none';
            downloadBtn.style.display = 'none';
            loader.style.display = 'flex';

            const [width, height] = aspectRatio.value.split('x');
            const seed = Math.floor(Math.random() * 9999999);
            const style = imageStyle.value;

            // প্রম্পটের সাথে স্টাইল যুক্ত করা এবং এনকোড করা
            const fullPrompt = rawPrompt + style;
            const encodedPrompt = encodeURIComponent(fullPrompt);
            
            // বৈধ মডেল `flux` ব্যবহার করে রিকোয়েস্ট
            const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=${width}&height=${height}&model=flux&seed=${seed}&nologo=true`;

            try {
                // Fetch ব্যবহার করে ইমেজ আনা যাতে এরর সহজে ধরা যায় এবং ডাউনলোডে সমস্যা না হয়
                const response = await fetch(imageUrl);
                if (!response.ok) throw new Error("ছবি তৈরিতে সমস্যা হয়েছে");

                const blob = await response.blob();
                
                // আগের blob url খালি করা
                if (currentImageBlobUrl) URL.revokeObjectURL(currentImageBlobUrl);
                currentImageBlobUrl = URL.createObjectURL(blob);

                outputImg.src = currentImageBlobUrl;
                outputImg.style.display = 'block';
                loader.style.display = 'none';
                downloadBtn.style.display = 'flex';
            } catch (err) {
                alert("দুঃখিত, ছবিটি লোড করা সম্ভব হয়নি। সার্ভার ব্যস্ত থাকতে পারে, আবার চেষ্টা করুন।");
                loader.style.display = 'none';
                placeholder.style.display = 'block';
            } finally {
                generateBtn.disabled = false;
            }
        });

        // ব্রাউজার থেকে সরাসরি গ্যালারিতে ছবি সেভ করার ফাংশন
        function downloadImage() {
            if (!currentImageBlobUrl) return;
            const a = document.createElement('a');
            a.href = currentImageBlobUrl;
            a.download = `technography-ai-${Date.now()}.jpg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
