<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technography AI Studio</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff3366;
            --primary-gradient: linear-gradient(135deg, #ff3366, #ff6b8b);
            --bg-dark: #0d1117;
            --card-bg: #161b22;
            --surface-bg: #21262d;
            --border-color: #30363d;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', 'Hind Siliguri', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(22, 27, 34, 0.9);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo span { color: #ff3366; }

        .main-container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
            width: 100%;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 25px;
            flex: 1;
        }

        @media (max-width: 900px) {
            .main-container { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .section-title {
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
        }

        textarea {
            width: 100%;
            height: 90px;
            background: var(--surface-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            color: #fff;
            font-size: 0.95rem;
            resize: none;
            outline: none;
        }

        textarea:focus { border-color: #ff3366; }

        /* Memory / Consistency Control Box */
        .consistency-box {
            background: rgba(255, 51, 102, 0.08);
            border: 1px dashed var(--primary);
            border-radius: 12px;
            padding: 12px 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .consistency-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .consistency-info span {
            font-size: 0.88rem;
            font-weight: 600;
            color: #fff;
            display: block;
        }

        .consistency-info small {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 24px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #30363d;
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(22px); }

        .btn-reset-memory {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 0.75rem;
            cursor: pointer;
            align-self: flex-start;
            display: none;
            align-items: center;
            gap: 5px;
        }

        .btn-reset-memory:hover {
            color: #fff;
            border-color: #ff3366;
        }

        /* Style Selection Grid */
        .style-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
            gap: 10px;
            max-height: 210px;
            overflow-y: auto;
            padding: 2px;
        }

        .style-item {
            background: var(--surface-bg);
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .style-item img {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
        }

        .style-item span {
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .style-item.active {
            border-color: #ff3366;
            background: rgba(255, 51, 102, 0.15);
        }

        .style-item.active span { color: #fff; font-weight: 600; }

        .btn-generate {
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(255, 51, 102, 0.3);
        }

        .btn-generate:disabled { opacity: 0.6; cursor: not-allowed; }

        /* Output Box */
        .preview-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--surface-bg);
            border: 2px dashed var(--border-color);
            border-radius: 14px;
            min-height: 380px;
            position: relative;
            overflow: hidden;
        }

        .placeholder-text {
            color: var(--text-muted);
            text-align: center;
            font-size: 0.9rem;
            padding: 20px;
        }

        .placeholder-text i {
            font-size: 3rem;
            margin-bottom: 12px;
            color: var(--border-color);
            display: block;
        }

        .generated-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }

        .loader {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            color: #ff3366;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            width: 42px;
            height: 42px;
            border: 4px solid rgba(255, 51, 102, 0.2);
            border-top: 4px solid #ff3366;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .btn-download {
            background: #238636;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            font-weight: 600;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">
            <i class="fa-solid fa-wand-magic-sparkles"></i> Technography <span>Studio</span>
        </a>
    </header>

    <div class="main-container">
        <!-- Input & Controls -->
        <div class="card">
            <div>
                <div class="section-title"><i class="fa-solid fa-pen-nib"></i> প্রম্পট লিখুন</div>
                <textarea id="promptInput" placeholder="যেমন: একটি ছেলে নীল টি-শার্ট পরে দাঁড়িয়ে আছে..."></textarea>
            </div>

            <!-- Client-Side State / Memory Toggle -->
            <div class="consistency-box">
                <div class="consistency-header">
                    <div class="consistency-info">
                        <span><i class="fa-solid fa-brain"></i> ক্যারেক্টার মেমোরি (Consistency)</span>
                        <small id="memoryStatus">বর্তমানে কোনো চরিত্র সেভ করা নেই</small>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="keepCharacterToggle">
                        <span class="slider"></span>
                    </label>
                </div>
                <button id="resetMemoryBtn" class="btn-reset-memory">
                    <i class="fa-solid fa-rotate-left"></i> মেমোরি মুছে নতুন চরিত্র শুরু করুন
                </button>
            </div>

            <!-- Styles Grid -->
            <div>
                <div class="section-title"><i class="fa-solid fa-palette"></i> স্টাইল বেছে নিন</div>
                <div class="style-grid" id="styleGrid">
                    <div class="style-item active" data-style="">
                        <div style="width:50px;height:50px;background:#30363d;border-radius:8px;display:flex;align-items:center;justify-content:center;"><i class="fa-solid fa-ban"></i></div>
                        <span>None</span>
                    </div>
                    <div class="style-item" data-style="3D Disney Pixar animation style, cute character, smooth lighting, highly detailed render">
                        <img src="https://images.unsplash.com/photo-1563089145-599997674d42?w=120&auto=format&fit=crop&q=60" alt="3D Cartoon">
                        <span>3D Cartoon</span>
                    </div>
                    <div class="style-item" data-style="Cute 3D claymation style, plasticine texture, soft pastel studio lighting, miniature toy">
                        <img src="https://images.unsplash.com/photo-1596461404969-9ae70f2830c1?w=120&auto=format&fit=crop&q=60" alt="Clay Toy">
                        <span>Clay Toy</span>
                    </div>
                    <div class="style-item" data-style="Vintage retro comic book art, vibrant pop art lines, dynamic halftone illustration">
                        <img src="https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?w=120&auto=format&fit=crop&q=60" alt="Comic Book">
                        <span>Comic</span>
                    </div>
                    <div class="style-item" data-style="Anime aesthetic, Makoto Shinkai style, expressive eyes, vibrant colors">
                        <img src="https://images.unsplash.com/photo-1534447677768-be436bb09401?w=120&auto=format&fit=crop&q=60" alt="Anime">
                        <span>Anime</span>
                    </div>
                    <div class="style-item" data-style="Cinematic, Photorealistic, 8k uhd, masterpiece">
                        <img src="https://images.unsplash.com/photo-1578632767115-351597cf2477?w=120&auto=format&fit=crop&q=60" alt="Realistic">
                        <span>Realistic</span>
                    </div>
                    <div class="style-item" data-style="Futuristic retro cyberpunk, neon colors, glow">
                        <img src="https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=120&auto=format&fit=crop&q=60" alt="Cyberpunk">
                        <span>Cyberpunk</span>
                    </div>
                </div>
            </div>

            <button id="generateBtn" class="btn-generate">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Generate Image
            </button>
        </div>

        <!-- Result Box -->
        <div class="card">
            <div class="section-title"><i class="fa-regular fa-image"></i> আউটপুট</div>
            <div class="preview-box">
                <div class="placeholder-text" id="placeholder">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    প্রম্পট লিখে 'Generate Image'-এ ট্যাপ করুন
                </div>

                <div class="loader" id="loader">
                    <div class="spinner"></div>
                    <p>AI ছবি তৈরি করছে...</p>
                </div>

                <img id="outputImg" class="generated-image" alt="AI Output">
            </div>

            <a id="downloadBtn" class="btn-download" href="#" download="technography-image.jpg">
                <i class="fa-solid fa-download"></i> ছবি ডাউনলোড করুন
            </a>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://technography-ai.onrender.com";

        let selectedStyle = "";

        // ব্রাউজারের নিজস্ব মেমোরি রিড করা (ইউজারের ডিভাইসে সেভ থাকে)
        let savedSeed = localStorage.getItem("tg_seed") || null;
        let savedBasePrompt = localStorage.getItem("tg_base_prompt") || "";

        const generateBtn = document.getElementById('generateBtn');
        const promptInput = document.getElementById('promptInput');
        const outputImg = document.getElementById('outputImg');
        const placeholder = document.getElementById('placeholder');
        const loader = document.getElementById('loader');
        const downloadBtn = document.getElementById('downloadBtn');
        const keepCharacterToggle = document.getElementById('keepCharacterToggle');
        const memoryStatus = document.getElementById('memoryStatus');
        const resetMemoryBtn = document.getElementById('resetMemoryBtn');

        function updateMemoryUI() {
            if (savedSeed && savedBasePrompt) {
                resetMemoryBtn.style.display = "inline-flex";
                if (keepCharacterToggle.checked) {
                    memoryStatus.innerText = "চরিত্র লক করা আছে (মিল বজায় রাখা হবে)";
                    memoryStatus.style.color = "#ff3366";
                } else {
                    memoryStatus.innerText = "একটি চরিত্র মেমোরিতে আছে (লক করতে টগল অন করুন)";
                    memoryStatus.style.color = "#8b949e";
                }
            } else {
                resetMemoryBtn.style.display = "none";
                memoryStatus.innerText = "কোনো চরিত্র সেভ নেই (নতুন ক্যারেক্টার তৈরি হবে)";
                memoryStatus.style.color = "#8b949e";
                keepCharacterToggle.checked = false;
            }
        }

        updateMemoryUI();

        // স্টাইল সিলেকশন
        document.querySelectorAll('.style-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.style-item').forEach(el => el.classList.remove('active'));
                item.classList.add('active');
                selectedStyle = item.getAttribute('data-style');
            });
        });

        keepCharacterToggle.addEventListener('change', () => {
            if (keepCharacterToggle.checked && (!savedSeed || !savedBasePrompt)) {
                alert("প্রথমে একটি চরিত্র বা দৃশ্যের ছবি বানান, তারপর এই সুইচটি অন করুন।");
                keepCharacterToggle.checked = false;
                return;
            }
            updateMemoryUI();
        });

        // মেমোরি রিসেট করা
        resetMemoryBtn.addEventListener('click', () => {
            localStorage.removeItem("tg_seed");
            localStorage.removeItem("tg_base_prompt");
            savedSeed = null;
            savedBasePrompt = "";
            keepCharacterToggle.checked = false;
            updateMemoryUI();
            alert("মেমোরি ক্লিয়ার করা হয়েছে। এবার সম্পূর্ণ নতুন চরিত্র তৈরি হবে।");
        });

        generateBtn.addEventListener('click', async () => {
            const rawPrompt = promptInput.value.trim();
            if (!rawPrompt) {
                alert("দয়া করে কোনো প্রম্পট লিখুন!");
                return;
            }

            // Consistency চালু থাকলে প্রম্পট মেমোরি থেকে যুক্ত হবে
            let promptToSend = rawPrompt;
            let seedToSend = null;

            if (keepCharacterToggle.checked && savedBasePrompt) {
                promptToSend = `Same character from: (${savedBasePrompt}), exact facial features, identical clothing and appearance, now performing: ${rawPrompt}`;
                seedToSend = savedSeed;
            }

            if (selectedStyle) {
                promptToSend += `, ${selectedStyle}`;
            }

            generateBtn.disabled = true;
            placeholder.style.display = 'none';
            outputImg.style.display = 'none';
            downloadBtn.style.display = 'none';
            loader.style.display = 'flex';

            try {
                const res = await fetch(`${BACKEND_URL}/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: promptToSend,
                        seed: seedToSend
                    })
                });

                const data = await res.json();

                if (data.success && data.image) {
                    outputImg.src = data.image;
                    outputImg.style.display = 'block';
                    loader.style.display = 'none';
                    generateBtn.disabled = false;

                    // টগল বন্ধ অবস্থায় ছবি বানালে নতুন চরিত্র ডিভাইসে সেভ হবে
                    if (!keepCharacterToggle.checked) {
                        savedSeed = data.seed;
                        savedBasePrompt = rawPrompt;
                        localStorage.setItem("tg_seed", data.seed);
                        localStorage.setItem("tg_base_prompt", rawPrompt);
                    }

                    updateMemoryUI();

                    downloadBtn.href = data.image;
                    downloadBtn.style.display = 'flex';
                } else {
                    throw new Error(data.error || "ছবি তৈরি করা যায়নি");
                }
            } catch (err) {
                alert("ত্রুটি: " + err.message);
                loader.style.display = 'none';
                placeholder.style.display = 'block';
                generateBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
