<script>
    // বিকল্প নির্ভরযোগ্য ফ্রি ট্রান্সলেশন মেথড
    async function translateToEnglish(text) {
        try {
            const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=bn|en`;
            const res = await fetch(url);
            const data = await res.json();
            if (data && data.responseData && data.responseData.translatedText) {
                return data.responseData.translatedText;
            }
            return text;
        } catch (e) {
            return text; // কোনো কারণে ট্রান্সলেট ফেইল হলেও আটকে থাকবে না
        }
    }

    function containsBengali(text) {
        return /[\u0980-\u09FF]/.test(text);
    }

    async function createTripleImages() {
        const promptInput = document.getElementById('promptInput');
        const userRawPrompt = promptInput.value.trim();
        const aspectRatio = document.getElementById('aspectRatio').value.split('x');
        const style = document.getElementById('stylePreset').value;

        if (!userRawPrompt) {
            alert('অনুগ্রহ করে ছবির বর্ণনা লিখুন!');
            return;
        }

        const btn = document.getElementById('generateBtn');
        const placeholder = document.getElementById('placeholder');
        const loader = document.getElementById('loader');
        const loadingStatus = document.getElementById('loadingStatus');
        const imageGrid = document.getElementById('imageGrid');

        btn.disabled = true;
        placeholder.style.display = 'none';
        imageGrid.style.display = 'none';
        imageGrid.innerHTML = '';
        loader.style.display = 'flex';

        let finalPrompt = userRawPrompt;

        // বাংলা হলে অনুবাদ করবে, ব্যর্থ হলেও কোড থামবে না
        if (containsBengali(userRawPrompt)) {
            loadingStatus.innerText = "বাংলা প্রম্পট ইংরেজিতে রূপান্তর করা হচ্ছে...";
            finalPrompt = await translateToEnglish(userRawPrompt);
        }

        loadingStatus.innerText = "৩টি Ultra-HD ছবি তৈরি হচ্ছে, অপেক্ষা করুন...";

        const enhancedPrompt = `${finalPrompt}, ${style}, sharp focus, 8k, photorealistic`;
        const width = aspectRatio[0];
        const height = aspectRatio[1];

        // ৩টি ইমেজ কনটেইনার সরাসরি তৈরি করা
        for (let i = 0; i < 3; i++) {
            const seed = Math.floor(Math.random() * 9999999) + (i * 1234);
            const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(enhancedPrompt)}?width=${width}&height=${height}&model=flux&seed=${seed}&nologo=true`;

            const card = document.createElement('div');
            card.className = 'image-card';
            card.innerHTML = `
                <img src="${imageUrl}" 
                     alt="AI Image ${i + 1}" 
                     loading="lazy"
                     style="${aspectRatio[0] === '768' ? 'aspect-ratio: 9/16;' : (aspectRatio[0] === '1280' ? 'aspect-ratio: 16/9;' : 'aspect-ratio: 1/1;')}"
                     onerror="this.parentElement.style.display='none'">
                <div class="card-action">
                    <a href="${imageUrl}" target="_blank" download="ai-image-${i+1}.jpg" class="btn-card-download">
                        <i class="fa-solid fa-arrow-down-to-bracket"></i> ডাউনলোড HD
                    </a>
                </div>
            `;
            imageGrid.appendChild(card);
        }

        // কিছুক্ষণের মধ্যে ছবি লোড প্রদর্শন
        setTimeout(() => {
            loader.style.display = 'none';
            imageGrid.style.display = 'grid';
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-bolt"></i> নতুন ৩টি ছবি তৈরি করুন';
        }, 3000);
    }
</script>
