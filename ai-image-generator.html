<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technography - Pro AI Studio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #111827;
            border-bottom: 1px solid #1f2937;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
            color: #22d3ee;
            text-decoration: none;
        }

        .home-btn {
            background: #1f2937;
            color: #94a3b8;
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
        }

        .container {
            max-width: 650px;
            width: 100%;
            margin: 0 auto;
            padding: 20px 15px 50px;
            flex: 1;
        }

        .card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 90px;
            background: #0b0f19;
            border: 1px solid #374151;
            border-radius: 12px;
            padding: 12px;
            color: #fff;
            font-size: 14px;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: #22d3ee;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 14px;
        }

        .field-label {
            font-size: 12px;
            font-weight: 600;
            color: #9ca3af;
            margin-bottom: 6px;
            display: block;
        }

        select {
            width: 100%;
            background: #0b0f19;
            border: 1px solid #374151;
            border-radius: 10px;
            padding: 10px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 18px 0 10px;
        }

        .section-title {
            font-size: 13px;
            font-weight: bold;
            color: #e5e7eb;
        }

        .clear-btn {
            font-size: 12px;
            color: #f87171;
            cursor: pointer;
            text-decoration: underline;
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 14px;
        }

        .tag {
            background: #1f2937;
            color: #d1d5db;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid #374151;
            transition: all 0.2s;
            user-select: none;
        }

        .tag.active {
            background: #0284c7;
            color: #fff;
            border-color: #38bdf8;
        }

        .btn-gen {
            width: 100%;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .btn-gen:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #loader {
            display: none;
            text-align: center;
            padding: 25px;
            background: #111827;
            border: 1px dashed #374151;
            border-radius: 14px;
            margin-bottom: 20px;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #38bdf8;
            border-radius: 50%;
            margin: 0 auto 8px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .single-card {
            display: none;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            overflow: hidden;
            flex-direction: column;
        }

        .img-container {
            position: relative;
            width: 100%;
            background: #030712;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            overflow: hidden;
        }

        .img-container img {
            width: 100%;
            height: auto;
            max-height: 80vh;
            object-fit: contain;
            display: block;
        }

        .btn-dl {
            display: block;
            text-align: center;
            background: #1f2937;
            color: #38bdf8;
            padding: 14px;
            font-size: 14px;
            font-weight: bold;
            border-top: 1px solid #374151;
            cursor: pointer;
            border: none;
            width: 100%;
        }

        .btn-dl:hover {
            background: #0284c7;
            color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">⚡ Technography AI</a>
        <a href="index.html" class="home-btn">হোম পেজ</a>
    </header>

    <div class="container">
        <div class="card">
            <span class="field-label">ছবির বর্ণনা লিখুন (বাংলা বা ইংরেজি):</span>
            <textarea id="prompt" placeholder="যেমন: সুন্দর একটি মেয়ের ছবি, লাল শাড়ি পরা, প্রাকৃতিক আলো..."></textarea>

            <div class="grid-2">
                <div>
                    <span class="field-label">AI Engine:</span>
                    <select id="engineVersion">
                        <option value="flux" selected>FLUX.1 Schnell (Original HD)</option>
                    </select>
                </div>
                <div>
                    <span class="field-label">Lighting Style:</span>
                    <select id="presetStyle">
                        <option value="raw photograph" selected>Photorealistic</option>
                        <option value="cinematic 3d render">Cinematic 3D</option>
                        <option value="anime aesthetic">Anime / Digital Art</option>
                    </select>
                </div>
            </div>

            <div class="section-header">
                <span class="section-title">Lighting & Quality:</span>
                <span class="clear-btn" onclick="clearActiveTags()">Clear all</span>
            </div>

            <div class="tags-container" id="lightingTags">
                <div class="tag active" onclick="toggleTag(this)" data-val="Studio lighting">Studio lighting</div>
                <div class="tag active" onclick="toggleTag(this)" data-val="Cinematic lighting">Cinematic lighting</div>
                <div class="tag active" onclick="toggleTag(this)" data-val="Hyper-realistic">Hyper-realistic</div>
                <div class="tag active" onclick="toggleTag(this)" data-val="8k resolution">8k resolution</div>
                <div class="tag" onclick="toggleTag(this)" data-val="Neon lights">Neon lights</div>
            </div>

            <button class="btn-gen" id="genBtn" onclick="startGeneration()">⚡ ছবি তৈরি করুন</button>
        </div>

        <div id="loader">
            <div class="spinner"></div>
            <p id="loaderText" style="font-size: 14px; color: #cbd5e1;">ছবি প্রসেস হচ্ছে...</p>
        </div>

        <div class="single-card" id="singleCard">
            <div class="img-container">
                <img id="mainImg" src="" alt="AI Image">
            </div>
            <button class="btn-dl" id="dlBtn" onclick="downloadImage()">ডাউনলোড ওয়াটারমার্ক-মুক্ত Full HD</button>
        </div>
    </div>

    <script>
        // আপনার লাইভ Render ব্যাকএন্ড লিঙ্ক
        const API_URL = "https://technography-ai.onrender.com/generate";

        function toggleTag(el) {
            el.classList.toggle('active');
        }

        function clearActiveTags() {
            document.querySelectorAll('.tag.active').forEach(t => t.classList.remove('active'));
        }

        function getSelectedTags() {
            const activeTags = [];
            document.querySelectorAll('.tag.active').forEach(t => {
                activeTags.push(t.getAttribute('data-val'));
            });
            return activeTags.join(', ');
        }

        function hasBengali(text) {
            return /[\u0980-\u09FF]/.test(text);
        }

        async function translateText(text) {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 2500);
                const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text) + "&langpair=bn|en", { signal: controller.signal });
                clearTimeout(timeoutId);
                const json = await res.json();
                if (json && json.responseData && json.responseData.translatedText) {
                    return json.responseData.translatedText;
                }
            } catch(e) {}
            return text;
        }

        async function startGeneration() {
            const promptBox = document.getElementById("prompt");
            const text = promptBox.value.trim();

            if (!text) {
                alert("অনুগ্রহ করে ছবির বিবরণ লিখুন!");
                return;
            }

            const btn = document.getElementById("genBtn");
            const loader = document.getElementById("loader");
            const loaderText = document.getElementById("loaderText");
            const card = document.getElementById("singleCard");
            const img = document.getElementById("mainImg");

            btn.disabled = true;
            card.style.display = "none";
            loader.style.display = "block";
            loaderText.innerText = "প্রম্পট প্রস্তুত হচ্ছে...";

            let promptEn = text;
            if (hasBengali(text)) {
                promptEn = await translateText(text);
            }

            const extraStyles = getSelectedTags();
            const stylePreset = document.getElementById("presetStyle").value;
            const fullPrompt = `${promptEn}, ${stylePreset}, ${extraStyles}`;

            loaderText.innerText = "FLUX AI দিয়ে আসল হাই-কোয়ালিটি ছবি তৈরি হচ্ছে (কিছুক্ষণ সময় লাগতে পারে)...";

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ prompt: fullPrompt })
                });

                const data = await response.json();

                if (data.success && data.image) {
                    img.src = data.image;
                    loader.style.display = "none";
                    card.style.display = "flex";
                    btn.disabled = false;
                    btn.innerText = "⚡ নতুন ছবি তৈরি করুন";
                } else {
                    throw new Error(data.error || "সার্ভার রেসপন্স দেয়নি");
                }
            } catch (err) {
                console.error(err);
                loaderText.innerText = "ছবি তৈরিতে সমস্যা হয়েছে। সার্ভার চালু হতে কয়েক সেকেন্ড লাগতে পারে, পুনরায় চেষ্টা করুন।";
                btn.disabled = false;
            }
        }

        function downloadImage() {
            const img = document.getElementById("mainImg");
            if (!img || !img.src) return;

            const a = document.createElement("a");
            a.download = `technography-flux-${Date.now()}.jpg`;
            a.href = img.src;
            a.click();
        }
    </script>
</body>
</html>
