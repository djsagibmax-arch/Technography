<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Generator | Technography</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-dark: #0b0f19;
            --card-bg: #151d30;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #263352;
            --accent: #06b6d4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', 'Hind Siliguri', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(21, 29, 48, 0.8);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo span {
            color: var(--primary);
        }

        .main-container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 15px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            flex: 1;
        }

        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
                margin: 15px auto;
            }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--accent);
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        textarea {
            width: 100%;
            height: 130px;
            background: #0d1322;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            transition: border 0.3s;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        .btn-generate {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            transition: opacity 0.3s;
        }

        .btn-generate:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .preview-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0d1322;
            border: 2px dashed var(--border-color);
            border-radius: 10px;
            min-height: 320px;
            position: relative;
            overflow: hidden;
        }

        .placeholder-text {
            color: var(--text-muted);
            text-align: center;
            font-size: 0.9rem;
            padding: 15px;
        }

        .placeholder-text i {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--border-color);
            display: block;
        }

        .generated-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
            border-radius: 6px;
        }

        .loader {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            color: var(--accent);
            text-align: center;
            padding: 15px;
        }

        .spinner {
            width: 42px;
            height: 42px;
            border: 3px solid rgba(6, 182, 212, 0.2);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-download {
            margin-top: 15px;
            background: #10b981;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            font-weight: 600;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
        }

        .btn-download:hover {
            background: #059669;
        }

        footer {
            text-align: center;
            padding: 15px;
            color: var(--text-muted);
            font-size: 0.8rem;
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">
            <i class="fa-solid fa-wand-magic-sparkles"></i> Technography <span>AI Engine</span>
        </a>
    </header>

    <div class="main-container">
        <!-- Control Card -->
        <div class="card">
            <h2><i class="fa-solid fa-sliders"></i> ইমেজ কনফিগারেশন</h2>
            
            <div class="input-group">
                <label for="promptInput">ছবির বিবরণ (Prompt) লিখুন:</label>
                <textarea id="promptInput" placeholder="A handsome young man portrait, photorealistic, 8k uhd, cinematic lighting..."></textarea>
            </div>

            <button id="generateBtn" class="btn-generate">
                <i class="fa-solid fa-bolt"></i> ছবি তৈরি করুন
            </button>
        </div>

        <!-- Result Card -->
        <div class="card">
            <h2><i class="fa-solid fa-image"></i> আউটপুট রেজাল্ট</h2>
            <div class="preview-box">
                <div class="placeholder-text" id="placeholder">
                    <i class="fa-regular fa-images"></i>
                    প্রম্পট লিখে 'ছবি তৈরি করুন' বাটনে চাপ দিন
                </div>

                <div class="loader" id="loader">
                    <div class="spinner"></div>
                    <p id="loaderText">Render ব্যাকএন্ড ছবি প্রসেস করছে...<br><small style="color: #94a3b8;">(সার্ভার স্লিপ থাকলে প্রথমবার ৪০-৫০ সেকেন্ড লাগতে পারে)</small></p>
                </div>

                <img id="outputImg" class="generated-image" alt="AI Generated Image">
            </div>

            <a id="downloadBtn" class="btn-download" href="#" download="technography-ai.jpg">
                <i class="fa-solid fa-download"></i> ছবি ডাউনলোড করুন
            </a>
        </div>
    </div>

    <footer>
        &copy; 2026 Technography AI. Powered by Render & Hugging Face.
    </footer>

    <script>
        // আপনার লাইভ Render ব্যাকএন্ড URL
        const BACKEND_URL = "https://technography-ai.onrender.com";

        const generateBtn = document.getElementById('generateBtn');
        const promptInput = document.getElementById('promptInput');
        const outputImg = document.getElementById('outputImg');
        const placeholder = document.getElementById('placeholder');
        const loader = document.getElementById('loader');
        const downloadBtn = document.getElementById('downloadBtn');

        generateBtn.addEventListener('click', async () => {
            const rawPrompt = promptInput.value.trim();
            if (!rawPrompt) {
                alert("দয়া করে একটি প্রম্পট লিখুন!");
                return;
            }

            // বাটন লক ও লোডার প্রদর্শন
            generateBtn.disabled = true;
            placeholder.style.display = 'none';
            outputImg.style.display = 'none';
            downloadBtn.style.display = 'none';
            loader.style.display = 'flex';

            try {
                const response = await fetch(`${BACKEND_URL}/generate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ prompt: rawPrompt })
                });

                const result = await response.json();

                if (result.success && result.image) {
                    outputImg.src = result.image;
                    outputImg.style.display = 'block';
                    loader.style.display = 'none';
                    generateBtn.disabled = false;

                    // ডাউনলোড বাটন রেডি করা
                    downloadBtn.href = result.image;
                    downloadBtn.style.display = 'flex';
                } else {
                    throw new Error(result.error || "ছবি তৈরি করা সম্ভব হয়নি");
                }

            } catch (error) {
                console.error(error);
                alert("ত্রুটি: " + error.message);
                loader.style.display = 'none';
                placeholder.style.display = 'block';
                generateBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
