<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technography - AI Image Studio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #030712;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* হেডার */
        header {
            background: #0f172a;
            border-bottom: 1px solid #1e293b;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
            color: #22d3ee;
            text-decoration: none;
        }

        .home-btn {
            background: #1e293b;
            color: #94a3b8;
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            border: 1px solid #334155;
        }

        /* মেইন কনটেইনার */
        .container {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 20px 15px 40px;
            flex: 1;
        }

        .title-box {
            text-align: center;
            margin-bottom: 20px;
        }

        .title-box h1 {
            font-size: 22px;
            color: #fff;
            margin-bottom: 6px;
        }

        .title-box p {
            font-size: 13px;
            color: #94a3b8;
        }

        /* ইনপুট কার্ড */
        .card {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            height: 90px;
            background: #030712;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 12px;
            color: #fff;
            font-size: 14px;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: #22d3ee;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 14px 0;
        }

        select {
            width: 100%;
            background: #030712;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .btn-gen {
            width: 100%;
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-gen:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* লোডার */
        #loader {
            display: none;
            text-align: center;
            padding: 30px;
            background: #0f172a;
            border: 1px dashed #334155;
            border-radius: 14px;
            margin-bottom: 20px;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #22d3ee;
            border-radius: 50%;
            margin: 0 auto 12px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* ইমেজ গ্রিড */
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
        }

        .img-card {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .img-card img {
            width: 100%;
            height: auto;
            display: block;
            background: #030712;
            min-height: 250px;
            object-fit: cover;
        }

        .img-card a {
            display: block;
            text-align: center;
            background: #1e293b;
            color: #22d3ee;
            text-decoration: none;
            padding: 10px;
            font-size: 13px;
            font-weight: 600;
            border-top: 1px solid #334155;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">⚡ Technography</a>
        <a href="index.html" class="home-btn">হোম পেজ</a>
    </header>

    <div class="container">
        <div class="title-box">
            <h1>AI ইমেজ স্টুডিও (3X)</h1>
            <p>বাংলা বা ইংরেজি যেভাবেই লিখুন, এক ক্লিকেই তৈরি হবে ৩টি ছবি</p>
        </div>

        <div class="card">
            <label for="prompt">ছবির বর্ণনা লিখুন (বাংলায় লিখলেও চলবে):</label>
            <textarea id="prompt" placeholder="যেমন: সুন্দর একটি মেয়ের ছবি, লাল শাড়ি পরা, ব্যাকগ্রাউন্ডে সূর্যাস্ত..."></textarea>

            <div class="options-grid">
                <div>
                    <label for="ratio">সাইজ / অনুপাত:</label>
                    <select id="ratio">
                        <option value="1024x1024" selected>স্কয়ার (1:1)</option>
                        <option value="768x1344">পোর্ট্রেট (9:16)</option>
                        <option value="1280x720">ল্যান্ডস্কেপ (16:9)</option>
                    </select>
                </div>

                <div>
                    <label for="style">কোয়ালিটি স্টাইল:</label>
                    <select id="style">
                        <option value="photorealistic, 8k, raw photo, sharp focus" selected>আল্ট্রা রিয়ালিস্টিক (HD)</option>
                        <option value="cinematic lighting, dramatic atmosphere, 8k">সিনেমাটিক</option>
                        <option value="anime style, vivid colors, detailed">অ্যানিমে আর্ট</option>
                    </select>
                </div>
            </div>

            <button class="btn-gen" id="genBtn" onclick="startGeneration()">⚡ একসাথে ৩টি ছবি তৈরি করুন</button>
        </div>

        <div id="loader">
            <div class="spinner"></div>
            <p id="loaderText" style="font-size: 14px; color: #cbd5e1;">ছবি প্রসেস হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...</p>
        </div>

        <div class="image-grid" id="grid"></div>
    </div>

    <script>
        // বাংলা কিনা চেক করা
        function hasBengali(text) {
            return /[\u0980-\u09FF]/.test(text);
        }

        // ফ্রি অনুবাদ ফাংশন
        async function translateText(text) {
            try {
                const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text) + "&langpair=bn|en");
                const json = await res.json();
                if (json && json.responseData && json.responseData.translatedText) {
                    return json.responseData.translatedText;
                }
            } catch(e) {}
            return text;
        }

        async function startGeneration() {
            const promptBox = document.getElementById("prompt");
            const text = promptBox.value.trim();
            const ratio = document.getElementById("ratio").value.split("x");
            const style = document.getElementById("style").value;

            if (!text) {
                alert("অনুগ্রহ করে কিছু লিখুন!");
                return;
            }

            const btn = document.getElementById("genBtn");
            const loader = document.getElementById("loader");
            const loaderText = document.getElementById("loaderText");
            const grid = document.getElementById("grid");

            btn.disabled = true;
            grid.innerHTML = "";
            loader.style.display = "block";

            let promptEn = text;

            // বাংলায় থাকলে অনুবাদ করবে
            if (hasBengali(text)) {
                loaderText.innerText = "বাংলা প্রম্পট অনুবাদ করা হচ্ছে...";
                promptEn = await translateText(text);
            }

            loaderText.innerText = "৩টি Ultra-HD ছবি তৈরি হচ্ছে, সামান্য অপেক্ষা করুন...";

            const finalPrompt = encodeURIComponent(promptEn + ", " + style + ", clean focus");
            const w = ratio[0];
            const h = ratio[1];

            // ৩টি ছবির কার্ড তৈরি
            for (let i = 0; i < 3; i++) {
                const seed = Math.floor(Math.random() * 899999) + 100000 + (i * 333);
                const imgUrl = "https://image.pollinations.ai/prompt/" + finalPrompt + "?width=" + w + "&height=" + h + "&model=flux&seed=" + seed + "&nologo=true";

                const card = document.createElement("div");
                card.className = "img-card";
                card.innerHTML = `
                    <img src="${imgUrl}" alt="AI Image" loading="lazy">
                    <a href="${imgUrl}" target="_blank" download="ai-image-${i+1}.jpg">ডাউনলোড HD (${i+1})</a>
                `;
                grid.appendChild(card);
            }

            // ছবি দেখানো
            setTimeout(() => {
                loader.style.display = "none";
                btn.disabled = false;
            }, 2500);
        }
    </script>
</body>
</html>
