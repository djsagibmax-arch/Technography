<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Generator | Technography</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-dark: #0b0f19;
            --card-bg: #151d30;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #263352;
            --accent: #06b6d4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', 'Hind Siliguri', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(21, 29, 48, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo span {
            color: var(--primary);
        }

        .main-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            flex: 1;
        }

        @media (max-width: 900px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 28px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h2 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--accent);
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        textarea {
            width: 100%;
            height: 130px;
            background: #0d1322;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            color: #fff;
            font-size: 1rem;
            resize: none;
            outline: none;
            transition: border 0.3s;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        .row-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        select {
            width: 100%;
            background: #0d1322;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            color: #fff;
            outline: none;
            cursor: pointer;
        }

        .btn-generate {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border: none;
            border-radius: 10px;
            padding: 15px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: opacity 0.3s, transform 0.2s;
        }

        .btn-generate:hover {
            opacity: 0.95;
            transform: translateY(-2px);
        }

        .btn-generate:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Result Section */
        .preview-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0d1322;
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            min-height: 380px;
        }

        .placeholder-text {
            color: var(--text-muted);
            text-align: center;
            font-size: 0.95rem;
            padding: 20px;
        }

        .placeholder-text i {
            font-size: 3rem;
            margin-bottom: 15px;
            color: var(--border-color);
            display: block;
        }

        .generated-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
            border-radius: 8px;
        }

        .loader {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            color: var(--accent);
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(6, 182, 212, 0.2);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-download {
            margin-top: 15px;
            background: #10b981;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            font-weight: 600;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.3s;
        }

        .btn-download:hover {
            background: #059669;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">
            <i class="fa-solid fa-wand-magic-sparkles"></i> Technography <span>AI</span>
        </a>
    </header>

    <div class="main-container">
        <!-- Control Card -->
        <div class="card">
            <h2><i class="fa-solid fa-sliders"></i> ইমেজ কনফিগারেশন</h2>
            
            <div class="input-group">
                <label for="promptInput">আপনার প্রম্পট লিখুন (বাংলা বা ইংরেজি):</label>
                <textarea id="promptInput" placeholder="যেমন: A beautiful futuristic city with flying cars, sunset, cinematic 8k photorealistic..."></textarea>
            </div>

            <div class="row-options">
                <div>
                    <label for="engineVersion">এআই ইঞ্জিন কোয়ালিটি:</label>
                    <select id="engineVersion">
                        <option value="flux-realism" selected>FLUX Realism Ultra (DSLR 8K)</option>
                        <option value="flux">FLUX.1 Schnell HD</option>
                        <option value="flux-anime">FLUX Anime Style</option>
                        <option value="flux-3d">FLUX 3D Render</option>
                    </select>
                </div>
                <div>
                    <label for="aspectRatio">আকার (Aspect Ratio):</label>
                    <select id="aspectRatio">
                        <option value="1024x1024" selected>Square (1:1)</option>
                        <option value="1280x720">Landscape (16:9)</option>
                        <option value="720x1280">Story / Reels (9:16)</option>
                        <option value="1024x768">Standard (4:3)</option>
                    </select>
                </div>
            </div>

            <button id="generateBtn" class="btn-generate">
                <i class="fa-solid fa-bolt"></i> ছবি তৈরি করুন (HD)
            </button>
        </div>

        <!-- Preview Card -->
        <div class="card">
            <h2><i class="fa-solid fa-image"></i> আউটপুট রেজাল্ট</h2>
            <div class="preview-box">
                <div class="placeholder-text" id="placeholder">
                    <i class="fa-regular fa-images"></i>
                    প্রম্পট লিখে 'ছবি তৈরি করুন' বাটনে চাপ দিন
                </div>

                <div class="loader" id="loader">
                    <div class="spinner"></div>
                    <p id="loaderText">FLUX AI আল্ট্রা ডিটেইল দিয়ে ছবি তৈরি করছে...</p>
                </div>

                <img id="outputImg" class="generated-image" alt="AI Generated Image">
            </div>

            <a id="downloadBtn" class="btn-download" href="#" target="_blank" download="technography-ai-image.jpg">
                <i class="fa-solid fa-download"></i> ফুল এইচডি ছবি ডাউনলোড করুন
            </a>
        </div>
    </div>

    <footer>
        &copy; 2026 Technography AI. সর্বস্বত্ব সংরক্ষিত।
    </footer>

    <script>
        const generateBtn = document.getElementById('generateBtn');
        const promptInput = document.getElementById('promptInput');
        const engineVersion = document.getElementById('engineVersion');
        const aspectRatio = document.getElementById('aspectRatio');
        const outputImg = document.getElementById('outputImg');
        const placeholder = document.getElementById('placeholder');
        const loader = document.getElementById('loader');
        const downloadBtn = document.getElementById('downloadBtn');

        generateBtn.addEventListener('click', async () => {
            const rawPrompt = promptInput.value.trim();
            if (!rawPrompt) {
                alert("দয়া করে একটি প্রম্পট লিখুন!");
                return;
            }

            // বাটন ও লোডার স্টেট সেট করা
            generateBtn.disabled = true;
            placeholder.style.display = 'none';
            outputImg.style.display = 'none';
            downloadBtn.style.display = 'none';
            loader.style.display = 'flex';

            // সাইজ ঠিক করা
            const [width, height] = aspectRatio.value.split('x');
            const seed = Math.floor(Math.random() * 9999999);
            const engine = engineVersion.value;

            // ছবির শার্পনেস ও কোয়ালিটি নিশ্চিত করার জন্য প্রম্পট এনহ্যান্সার
            let enhancedPrompt = rawPrompt;
            if (engine === 'flux-realism') {
                enhancedPrompt += ", highly detailed, sharp focus, 8k uhd, dslr, soft lighting, high quality, film grain, Fujifilm XT3, photorealistic";
            } else if (engine === 'flux') {
                enhancedPrompt += ", high resolution, crisp details, photorealistic lighting";
            }

            const cleanPrompt = encodeURIComponent(enhancedPrompt);

            // Pollinations FLUX Engine URL (ওয়াটারমার্ক মুক্ত & ৩০ স্টেপস)
            const imageUrl = `https://image.pollinations.ai/prompt/${cleanPrompt}?width=${width}&height=${height}&model=${engine}&seed=${seed}&nologo=true&enhance=true&steps=30&quality=heavy`;

            try {
                // ছবিটি লোড করা
                const tempImage = new Image();
                tempImage.crossOrigin = "anonymous";
                tempImage.src = imageUrl;

                tempImage.onload = () => {
                    outputImg.src = imageUrl;
                    outputImg.style.display = 'block';
                    loader.style.display = 'none';
                    generateBtn.disabled = false;

                    // ডাউনলোড বাটন সক্রিয় করা
                    downloadBtn.href = imageUrl;
                    downloadBtn.style.display = 'flex';
                };

                tempImage.onerror = () => {
                    throw new Error("ইমেজ লোড হতে সমস্যা হয়েছে");
                };

            } catch (error) {
                console.warn("রিট্রাই ট্রাই করা হচ্ছে...");
                // ব্যাকআপ ট্রাই (Standard Model)
                const fallbackUrl = `https://image.pollinations.ai/prompt/${cleanPrompt}?width=${width}&height=${height}&model=flux&seed=${seed}&nologo=true`;
                outputImg.src = fallbackUrl;
                outputImg.onload = () => {
                    outputImg.style.display = 'block';
                    loader.style.display = 'none';
                    generateBtn.disabled = false;
                    downloadBtn.href = fallbackUrl;
                    downloadBtn.style.display = 'flex';
                };
                outputImg.onerror = () => {
                    alert("দুঃখিত, এই মুহূর্তে ছবিটি লোড করা সম্ভব হয়নি। আবার চেষ্টা করুন।");
                    loader.style.display = 'none';
                    placeholder.style.display = 'block';
                    generateBtn.disabled = false;
                };
            }
        });
    </script>
</body>
</html>
