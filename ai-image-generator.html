<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Generator | Technography</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-dark: #0b0f19;
            --card-bg: #151d30;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #263352;
            --accent: #06b6d4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', 'Hind Siliguri', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(21, 29, 48, 0.8);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo span {
            color: var(--primary);
        }

        .main-container {
            max-width: 1100px;
            margin: 25px auto;
            padding: 0 15px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            flex: 1;
        }

        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
                margin: 15px auto;
            }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--accent);
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        textarea {
            width: 100%;
            height: 120px;
            background: #0d1322;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            transition: border 0.3s;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        .row-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        select {
            width: 100%;
            background: #0d1322;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            color: #fff;
            outline: none;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .btn-generate {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: opacity 0.3s;
        }

        .btn-generate:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .preview-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0d1322;
            border: 2px dashed var(--border-color);
            border-radius: 10px;
            min-height: 320px;
            position: relative;
            overflow: hidden;
        }

        .placeholder-text {
            color: var(--text-muted);
            text-align: center;
            font-size: 0.9rem;
            padding: 15px;
        }

        .placeholder-text i {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--border-color);
            display: block;
        }

        .generated-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
            border-radius: 6px;
        }

        .loader {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            color: var(--accent);
            text-align: center;
            padding: 15px;
        }

        .spinner {
            width: 42px;
            height: 42px;
            border: 3px solid rgba(6, 182, 212, 0.2);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-download {
            margin-top: 15px;
            background: #10b981;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            font-weight: 600;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-download:hover {
            background: #059669;
        }

        footer {
            text-align: center;
            padding: 15px;
            color: var(--text-muted);
            font-size: 0.8rem;
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">
            <i class="fa-solid fa-wand-magic-sparkles"></i> Technography <span>AI</span>
        </a>
    </header>

    <div class="main-container">
        <!-- Control Card -->
        <div class="card">
            <h2><i class="fa-solid fa-sliders"></i> ইমেজ কনফিগারেশন</h2>
            
            <div class="input-group">
                <label for="promptInput">ছবির প্রম্পট লিখুন:</label>
                <textarea id="promptInput" placeholder="A futuristic car on a neon highway, cinematic lighting, ultra-detailed 8k..."></textarea>
            </div>

            <div class="row-options">
                <div>
                    <label for="engineVersion">এআই মডেল:</label>
                    <select id="engineVersion">
                        <option value="flux-realism" selected>FLUX Realism Ultra</option>
                        <option value="flux">FLUX Schnell HD</option>
                        <option value="flux-anime">Anime Style</option>
                        <option value="flux-3d">3D Render</option>
                    </select>
                </div>
                <div>
                    <label for="aspectRatio">রেশিও:</label>
                    <select id="aspectRatio">
                        <option value="1024x1024" selected>Square (1:1)</option>
                        <option value="1280x720">Landscape (16:9)</option>
                        <option value="720x1280">Reels (9:16)</option>
                    </select>
                </div>
            </div>

            <button id="generateBtn" class="btn-generate">
                <i class="fa-solid fa-bolt"></i> ছবি তৈরি করুন
            </button>
        </div>

        <!-- Output Card -->
        <div class="card">
            <h2><i class="fa-solid fa-image"></i> আউটপুট রেজাল্ট</h2>
            <div class="preview-box">
                <div class="placeholder-text" id="placeholder">
                    <i class="fa-regular fa-images"></i>
                    প্রম্পট লিখে 'ছবি তৈরি করুন' বাটনে চাপ দিন
                </div>

                <div class="loader" id="loader">
                    <div class="spinner"></div>
                    <p id="loaderText">FLUX AI ছবি রেন্ডার করছে...</p>
                </div>

                <img id="outputImg" class="generated-image" alt="Generated Output">
            </div>

            <a id="downloadBtn" class="btn-download" href="#" target="_blank" download="technography-ai.jpg">
                <i class="fa-solid fa-download"></i> ফুল এইচডি ছবি ডাউনলোড
            </a>
        </div>
    </div>

    <footer>
        &copy; 2026 Technography AI. সর্বস্বত্ব সংরক্ষিত।
    </footer>

    <script>
        const generateBtn = document.getElementById('generateBtn');
        const promptInput = document.getElementById('promptInput');
        const engineVersion = document.getElementById('engineVersion');
        const aspectRatio = document.getElementById('aspectRatio');
        const outputImg = document.getElementById('outputImg');
        const placeholder = document.getElementById('placeholder');
        const loader = document.getElementById('loader');
        const downloadBtn = document.getElementById('downloadBtn');

        generateBtn.addEventListener('click', () => {
            const rawPrompt = promptInput.value.trim();
            if (!rawPrompt) {
                alert("দয়া করে একটি প্রম্পট লিখুন!");
                return;
            }

            // বাটন লক ও স্টেট ক্লিয়ার
            generateBtn.disabled = true;
            placeholder.style.display = 'none';
            outputImg.style.display = 'none';
            downloadBtn.style.display = 'none';
            loader.style.display = 'flex';

            const [width, height] = aspectRatio.value.split('x');
            const seed = Math.floor(Math.random() * 99999999);
            const timestamp = Date.now(); // ক্যাশ প্রতিরোধক
            const engine = engineVersion.value;

            // প্রম্পট এনকোডিং
            const enhancedPrompt = encodeURIComponent(rawPrompt + ", 8k uhd, photorealistic, sharp focus");
            
            // রেন্ডার URL
            const imageUrl = `https://image.pollinations.ai/prompt/${enhancedPrompt}?width=${width}&height=${height}&model=${engine}&seed=${seed}&nologo=true&t=${timestamp}`;

            // টাইমআউট হ্যান্ডলার (৩০ সেকেন্ড)
            const requestTimeout = setTimeout(() => {
                resetUIOnError("সার্ভার রেসপন্স করতে বেশি সময় নিচ্ছে। আবার চেষ্টা করুন।");
            }, 30000);

            // নতুন অবজেক্ট দিয়ে ইমেজ প্রিলোড
            const preloader = new Image();
            preloader.crossOrigin = "anonymous";
            preloader.src = imageUrl;

            preloader.onload = () => {
                clearTimeout(requestTimeout);
                outputImg.src = imageUrl;
                outputImg.style.display = 'block';
                loader.style.display = 'none';
                
                generateBtn.disabled = false;
                downloadBtn.href = imageUrl;
                downloadBtn.style.display = 'flex';
            };

            preloader.onerror = () => {
                clearTimeout(requestTimeout);
                resetUIOnError("ছবি লোড করতে সমস্যা হয়েছে। অনুগ্রহ করে আবার চেষ্টা করুন।");
            };

            function resetUIOnError(message) {
                alert(message);
                loader.style.display = 'none';
                placeholder.style.display = 'block';
                generateBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
