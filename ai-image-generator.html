<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technography - AI Image Studio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #030712;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #0f172a;
            border-bottom: 1px solid #1e293b;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
            color: #22d3ee;
            text-decoration: none;
        }

        .home-btn {
            background: #1e293b;
            color: #94a3b8;
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            border: 1px solid #334155;
        }

        .container {
            max-width: 960px;
            width: 100%;
            margin: 0 auto;
            padding: 20px 15px 40px;
            flex: 1;
        }

        .title-box {
            text-align: center;
            margin-bottom: 20px;
        }

        .title-box h1 {
            font-size: 22px;
            color: #fff;
            margin-bottom: 6px;
        }

        .title-box p {
            font-size: 13px;
            color: #94a3b8;
        }

        .card {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            height: 85px;
            background: #030712;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 12px;
            color: #fff;
            font-size: 14px;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: #22d3ee;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 14px 0;
        }

        select {
            width: 100%;
            background: #030712;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .btn-gen {
            width: 100%;
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-gen:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #loader {
            display: none;
            text-align: center;
            padding: 25px;
            background: #0f172a;
            border: 1px dashed #334155;
            border-radius: 14px;
            margin-bottom: 20px;
        }

        .spinner {
            width: 34px;
            height: 34px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #22d3ee;
            border-radius: 50%;
            margin: 0 auto 10px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
        }

        .img-card {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* ওয়াটারমার্ক কাটার ফ্রেম */
        .img-wrapper {
            position: relative;
            width: 100%;
            height: 320px;
            background: #030712;
            overflow: hidden;
        }

        .img-wrapper img {
            width: 100%;
            height: calc(100% + 36px); /* ওয়াটারমার্ক নিচে ঠেলে লুকানো */
            object-fit: cover;
            display: block;
        }

        .img-loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b1120;
            color: #94a3b8;
            font-size: 13px;
        }

        .btn-dl {
            display: block;
            text-align: center;
            background: #1e293b;
            color: #22d3ee;
            text-decoration: none;
            padding: 12px;
            font-size: 13px;
            font-weight: bold;
            border-top: 1px solid #334155;
            cursor: pointer;
        }

        .btn-dl:hover {
            background: #22d3ee;
            color: #030712;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">⚡ Technography</a>
        <a href="index.html" class="home-btn">হোম পেজ</a>
    </header>

    <div class="container">
        <div class="title-box">
            <h1>AI ইমেজ স্টুডিও (3X Ultra-HD)</h1>
            <p>সম্পূর্ণ নিখুঁত ও ওয়াটারমার্ক ছাড়া ৩টি ভিন্ন ছবি তৈরি করুন</p>
        </div>

        <div class="card">
            <label for="prompt">ছবির বর্ণনা লিখুন (বাংলায় লিখলেও চলবে):</label>
            <textarea id="prompt" placeholder="যেমন: সুন্দর একটি মেয়ের ছবি, লাল শাড়ি পরা, সূর্যাস্তের আলো..."></textarea>

            <div class="options-grid">
                <div>
                    <label for="ratio">সাইজ / অনুপাত:</label>
                    <select id="ratio">
                        <option value="1024x1024" selected>স্কয়ার (1:1 - Post)</option>
                        <option value="768x1344">পোর্ট্রেট (9:16 - Reels)</option>
                        <option value="1280x720">ল্যান্ডস্কেপ (16:9 - YouTube)</option>
                    </select>
                </div>

                <div>
                    <label for="style">কোয়ালিটি স্টাইল:</label>
                    <select id="style">
                        <option value="masterpiece, 8k, photorealistic, sharp focus, highly detailed skin texture, dslr" selected>আল্ট্রা রিয়ালিস্টিক (HD)</option>
                        <option value="cinematic lighting, dramatic, hyper-detailed">সিনেমাটিক</option>
                        <option value="anime art, vivid colors, detailed">অ্যানিমে আর্ট</option>
                    </select>
                </div>
            </div>

            <button class="btn-gen" id="genBtn" onclick="startGeneration()">⚡ একসাথে ৩টি ছবি তৈরি করুন</button>
        </div>

        <div id="loader">
            <div class="spinner"></div>
            <p id="loaderText" style="font-size: 14px; color: #cbd5e1;">প্রসেস হচ্ছে...</p>
        </div>

        <div class="image-grid" id="grid"></div>
    </div>

    <script>
        function hasBengali(text) {
            return /[\u0980-\u09FF]/.test(text);
        }

        async function translateText(text) {
            try {
                const res = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text) + "&langpair=bn|en");
                const json = await res.json();
                if (json && json.responseData && json.responseData.translatedText) {
                    return json.responseData.translatedText;
                }
            } catch(e) {}
            return text;
        }

        // ৩টি ইমেজ একটির পর একটি নিখুঁতভাবে লোড করানো
        async function loadCardSequentially(container, prompt, w, h, index) {
            const seed = Math.floor(Math.random() * 900000) + (index * 7777);
            
            // সার্ভার ট্রাফিক এড়াতে বিভিন্ন মডেল ডিস্ট্রিবিউট করা
            const modelType = (index === 0) ? "flux" : (index === 1 ? "turbo" : "flux");
            const imgUrl = `https://image.pollinations.ai/prompt/${prompt}?width=${w}&height=${h}&model=${modelType}&seed=${seed}&nologo=true&enhance=true`;

            const card = document.createElement("div");
            card.className = "img-card";
            card.innerHTML = `
                <div class="img-wrapper">
                    <div class="img-loading" id="load-${index}">ছবি তৈরি হচ্ছে... (${index + 1}/3)</div>
                    <img id="img-${index}" src="" alt="AI Image ${index+1}" style="display:none;">
                </div>
                <a class="btn-dl" onclick="downloadCleanImage('img-${index}', ${index+1})">ডাউনলোড HD (${index+1})</a>
            `;
            container.appendChild(card);

            const imgEl = card.querySelector(`#img-${index}`);
            const loadEl = card.querySelector(`#load-${index}`);

            // ইমেজ লোড এবং অটো রিট্রাই লজিক
            return new Promise((resolve) => {
                imgEl.src = imgUrl;

                imgEl.onload = () => {
                    loadEl.style.display = "none";
                    imgEl.style.display = "block";
                    resolve();
                };

                // ফেইল করলে বিকল্প সার্ভার সিড দিয়ে অটো রিলোড করবে
                imgEl.onerror = () => {
                    const fallbackUrl = `https://image.pollinations.ai/prompt/${prompt}?width=${w}&height=${h}&seed=${seed + 999}&nologo=true`;
                    imgEl.src = fallbackUrl;
                    imgEl.onload = () => {
                        loadEl.style.display = "none";
                        imgEl.style.display = "block";
                        resolve();
                    };
                };
            });
        }

        async function startGeneration() {
            const promptBox = document.getElementById("prompt");
            const text = promptBox.value.trim();
            const ratio = document.getElementById("ratio").value.split("x");
            const style = document.getElementById("style").value;

            if (!text) {
                alert("অনুগ্রহ করে ছবির বিবরণ লিখুন!");
                return;
            }

            const btn = document.getElementById("genBtn");
            const loader = document.getElementById("loader");
            const loaderText = document.getElementById("loaderText");
            const grid = document.getElementById("grid");

            btn.disabled = true;
            grid.innerHTML = "";
            loader.style.display = "block";

            let promptEn = text;
            if (hasBengali(text)) {
                loaderText.innerText = "বাংলা প্রম্পট অনুবাদ হচ্ছে...";
                promptEn = await translateText(text);
            }

            loaderText.innerText = "৩টি ছবি রেন্ডার হচ্ছে, অপেক্ষা করুন...";

            const cleanPrompt = promptEn.replace(/watermark|logo|text/gi, "");
            const finalPrompt = encodeURIComponent(`${cleanPrompt}, ${style}, beautiful lighting, unblurred`);
            const w = ratio[0];
            const h = ratio[1];

            // একের পর এক ৩টি ছবি লোড করবে যাতে সার্ভার ড্রপ না করে
            for (let i = 0; i < 3; i++) {
                loaderText.innerText = `ছবি তৈরি হচ্ছে: ${i + 1} / 3...`;
                await loadCardSequentially(grid, finalPrompt, w, h, i);
            }

            loader.style.display = "none";
            btn.disabled = false;
            btn.innerText = "⚡ নতুন ৩টি ছবি তৈরি করুন";
        }

        // ডাউনলোড করার সময় স্বয়ংক্রিয়ভাবে নিচের ওয়াটারমার্ক ক্রপ করে সেভ করার ফাংশন
        function downloadCleanImage(imgId, index) {
            const img = document.getElementById(imgId);
            if (!img) return;

            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");

            // নিচের ওয়াটারমার্ক অংশ বাদ দিয়ে ক্যানভাসে ড্র করা
            const cropBottomPixels = 36;
            canvas.width = img.naturalWidth;
            canvas.height = img.naturalHeight - cropBottomPixels;

            ctx.drawImage(img, 0, 0, img.naturalWidth, img.naturalHeight - cropBottomPixels, 0, 0, canvas.width, canvas.height);

            const a = document.createElement("a");
            a.download = `technography-ai-${index}.jpg`;
            a.href = canvas.toDataURL("image/jpeg", 0.95);
            a.click();
        }
    </script>
</body>
</html>
