<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Voice Generator - Technography</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #030712; color: #f3f4f6; min-height: 100vh; display: flex; flex-direction: column; }
    
    /* হেডার */
    header { background: #0f172a; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; }
    .brand { font-size: 20px; font-weight: bold; color: #22d3ee; text-decoration: none; }
    .back-btn { color: #94a3b8; text-decoration: none; font-size: 14px; display: flex; align-items: center; gap: 6px; }
    .back-btn:hover { color: #fff; }

    /* মেইন কার্ড */
    .container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 25px 15px; }
    .card { background: #111827; border: 1px solid #1f2937; width: 100%; max-width: 550px; border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
    .card h2 { text-align: center; color: #22d3ee; margin-bottom: 8px; font-size: 22px; font-weight: 800; }
    .card p.subtitle { text-align: center; color: #9ca3af; font-size: 13px; margin-bottom: 22px; }

    /* ইনপুট ফিল্ড ও বাটন */
    label { font-size: 13px; color: #cbd5e1; margin-bottom: 6px; display: block; font-weight: 600; }
    textarea { width: 100%; height: 120px; border-radius: 12px; border: 1px solid #374151; background: #030712; color: #fff; padding: 12px; font-size: 14px; resize: vertical; outline: none; margin-bottom: 15px; }
    textarea:focus { border-color: #22d3ee; }

    .grid-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    select { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #374151; background: #030712; color: #fff; font-size: 13px; outline: none; cursor: pointer; }
    
    .btn-submit { width: 100%; padding: 14px; border-radius: 12px; border: none; background: linear-gradient(135deg, #06b6d4, #2563eb); color: #fff; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-submit:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-submit:disabled { background: #374151; cursor: not-allowed; opacity: 0.6; }

    /* স্ট্যাটাস ও অডিও প্লেয়ার */
    #statusMsg { text-align: center; margin-top: 15px; font-size: 13px; color: #22d3ee; font-weight: 500; }
    audio { width: 100%; margin-top: 20px; display: none; outline: none; }
    
    .download-link { display: none; text-align: center; margin-top: 15px; color: #34d399; font-size: 14px; text-decoration: none; font-weight: bold; }
    .download-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="brand">Technography</a>
    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> হোমপেজে ফিরুন</a>
  </header>

  <div class="container">
    <div class="card">
      <h2><i class="fa-solid fa-microphone-lines"></i> AI Text to Voice</h2>
      <p class="subtitle">আপনার টেক্সটকে প্রফেশনাল ও ন্যাচারাল ভয়েসে রূপান্তর করুন</p>

      <label for="ttsInput">টেক্সট লিখুন:</label>
      <textarea id="ttsInput" placeholder="এখানে বাংলা বা ইংরেজি লিখুন..."></textarea>

      <div class="grid-options">
        <div>
          <label for="ttsVoice">ভয়েস সিলেক্ট করুন:</label>
          <select id="ttsVoice">
            <!-- সর্বোচ্চ ন্যাচারাল ভয়েস তালিকা -->
            <option value="bn-IN-BashkarNeural" selected>🇮🇳 ভাস্কর (গভীর ও ন্যাচারাল - পুরুষ)</option>
            <option value="bn-IN-TanishaaNeural">🇮🇳 তানিশা (মিষ্টি কণ্ঠ - নারী)</option>
            <option value="bn-BD-PradeepNeural">🇧🇩 প্রদীপ (বাংলাদেশ - পুরুষ)</option>
            <option value="bn-BD-NabanitaNeural">🇧🇩 নবনীতা (বাংলাদেশ - নারী)</option>
            <option value="en-US-ChristopherNeural">🇺🇸 Christopher (US - Male)</option>
            <option value="en-US-JennyNeural">🇺🇸 Jenny (US - Female)</option>
          </select>
        </div>

        <div>
          <label for="ttsSpeed">কথা বলার গতি (Speed):</label>
          <select id="ttsSpeed">
            <option value="-10%">ধীর (-10%)</option>
            <option value="-4%" selected>ন্যাচারাল রিল্যাক্সড (-4%)</option>
            <option value="+0%">স্বাভাবিক (Normal)</option>
            <option value="+8%">রিলস/শর্টস ফাস্ট (+8%)</option>
          </select>
        </div>
      </div>

      <button id="convertBtn" class="btn-submit" onclick="generateSpeech()">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
        <span>ভয়েস তৈরি করুন</span>
      </button>

      <div id="statusMsg"></div>
      <audio id="audioPlayer" controls></audio>
      <a id="downloadBtn" class="download-link" href="#" download="technography_voice.mp3">
        <i class="fa-solid fa-download"></i> অডিও ডাউনলোড করুন
      </a>
    </div>
  </div>

  <script>
    // আপনার লাইভ Render ব্যাকএন্ড লিঙ্ক
    const BACKEND_URL = "https://technograpy-ai-voice.onrender.com/generate-audio";

    async function generateSpeech() {
      const text = document.getElementById("ttsInput").value;
      const voice = document.getElementById("ttsVoice").value;
      const rate = document.getElementById("ttsSpeed").value;
      const btn = document.getElementById("convertBtn");
      const status = document.getElementById("statusMsg");
      const player = document.getElementById("audioPlayer");
      const downloadBtn = document.getElementById("downloadBtn");

      if (!text.trim()) {
        alert("দয়া করে কিছু টেক্সট লিখুন!");
        return;
      }

      btn.disabled = true;
      status.innerText = "ভয়েস তৈরি হচ্ছে, অনুগ্রহ করে কয়েক সেকেন্ড অপেক্ষা করুন...";
      player.style.display = "none";
      downloadBtn.style.display = "none";

      try {
        const response = await fetch(BACKEND_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text, voice, rate })
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.detail || "সার্ভার থেকে সাড়া পাওয়া যায়নি");
        }

        const blob = await response.blob();
        const audioUrl = URL.createObjectURL(blob);

        player.src = audioUrl;
        player.style.display = "block";
        player.play();

        downloadBtn.href = audioUrl;
        downloadBtn.style.display = "block";

        status.innerText = "✅ ভয়েস সফলভাবে তৈরি হয়েছে!";
      } catch (err) {
        status.innerText = "❌ সমস্যা হয়েছে: " + err.message;
      } finally {
        btn.disabled = false;
      }
    }
  </script>

</body>
</html>
