<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Voice Generator - Technography</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0b1120; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
    
    /* হেডার বার */
    header { background: #0f172a; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; }
    .brand { font-size: 20px; font-weight: bold; color: #38bdf8; text-decoration: none; }
    .back-btn { color: #94a3b8; text-decoration: none; font-size: 14px; display: flex; align-items: center; gap: 6px; }
    .back-btn:hover { color: #fff; }

    /* মেইন কন্টেইনার */
    .container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 25px 15px; }
    .card { background: #131c31; border: 1px solid #1e293b; width: 100%; max-width: 550px; border-radius: 16px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .card h2 { text-align: center; color: #38bdf8; margin-bottom: 8px; font-size: 22px; }
    .card p.subtitle { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 20px; }

    /* ইনপুট ও বাটন */
    label { font-size: 13px; color: #cbd5e1; margin-bottom: 6px; display: block; }
    textarea { width: 100%; height: 120px; border-radius: 10px; border: 1px solid #334155; background: #0b1120; color: #fff; padding: 12px; font-size: 14px; resize: vertical; outline: none; margin-bottom: 15px; }
    textarea:focus { border-color: #38bdf8; }

    select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #0b1120; color: #fff; font-size: 14px; outline: none; margin-bottom: 20px; cursor: pointer; }
    
    .btn-submit { width: 100%; padding: 14px; border-radius: 10px; border: none; background: linear-gradient(135deg, #0284c7, #2563eb); color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    .btn-submit:hover { opacity: 0.9; }
    .btn-submit:disabled { background: #334155; cursor: not-allowed; }

    /* স্ট্যাটাস ও অডিও প্লেয়ার */
    #statusMsg { text-align: center; margin-top: 15px; font-size: 14px; color: #38bdf8; }
    audio { width: 100%; margin-top: 20px; display: none; outline: none; }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="brand">Technography</a>
    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> হোমপেজে ফিরুন</a>
  </header>

  <div class="container">
    <div class="card">
      <h2><i class="fa-solid fa-microphone-lines"></i> AI Text to Voice</h2>
      <p class="subtitle">আপনার টেক্সটকে প্রফেশনাল ভয়েসে রূপান্তর করুন</p>

      <label for="ttsInput">আপনার টেক্সট লিখুন:</label>
      <textarea id="ttsInput" placeholder="এখানে বাংলা বা ইংরেজি লিখুন..."></textarea>

      <label for="ttsVoice">ভয়েস সিলেক্ট করুন:</label>
      <select id="ttsVoice">
        <option value="bn-BD-PradeepNeural">🇧🇩 বাংলা (বাংলাদেশ) - প্রদীপ (পুরুষ)</option>
        <option value="bn-BD-NabanitaNeural">🇧🇩 বাংলা (বাংলাদেশ) - নবনীতা (নারী)</option>
        <option value="en-US-ChristopherNeural">🇺🇸 English (US) - Christopher (Male)</option>
        <option value="en-US-JennyNeural">🇺🇸 English (US) - Jenny (Female)</option>
      </select>

      <button id="convertBtn" class="btn-submit" onclick="generateSpeech()">ভয়েস তৈরি করুন</button>

      <div id="statusMsg"></div>
      <audio id="audioPlayer" controls></audio>
    </div>
  </div>

  <script>
    // এখানে আপনার Render-এ ডিপ্লয় করা পাইথন ব্যাকএন্ডের লিংক বসাবেন
    const BACKEND_URL = "https://YOUR-APP-NAME.onrender.com/generate-audio";

    async function generateSpeech() {
      const text = document.getElementById("ttsInput").value;
      const voice = document.getElementById("ttsVoice").value;
      const btn = document.getElementById("convertBtn");
      const status = document.getElementById("statusMsg");
      const player = document.getElementById("audioPlayer");

      if (!text.trim()) {
        alert("দয়া করে কিছু টেক্সট লিখুন!");
        return;
      }

      btn.disabled = true;
      status.innerText = "ভয়েস তৈরি হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...";
      player.style.display = "none";

      try {
        const response = await fetch(BACKEND_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text, voice })
        });

        if (!response.ok) throw new Error("সার্ভার থেকে সাড়া পাওয়া যায়নি");

        const blob = await response.blob();
        player.src = URL.createObjectURL(blob);
        player.style.display = "block";
        player.play();
        status.innerText = "✅ ভয়েস তৈরি সম্পন্ন!";
      } catch (err) {
        status.innerText = "❌ সমস্যা হয়েছে: " + err.message;
      } finally {
        btn.disabled = false;
      }
    }
  </script>

</body>
</html>
