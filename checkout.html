    <!-- Scripts -->
    <script>
        // ১. Supabase কানেকশন সেটআপ
        const supabaseUrl = 'https://safymsagxrjymhfdzkph.supabase.co';
        const supabaseKey = 'sb_publishable_qthdZZg-tjDRc_loLbVUYg_b77rK-Bv';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        let selectedMethod = 'bkash';

        window.onload = function() {
            if (!sessionStorage.getItem('modal_shown')) {
                openPaymentModal();
                sessionStorage.setItem('modal_shown', 'true');
            }
        };

        function openPaymentModal() {
            document.getElementById('paymentModal').style.display = 'flex';
        }

        function closePaymentModal() {
            document.getElementById('paymentModal').style.display = 'none';
        }

        function selectPayment(method) {
            selectedMethod = method;
            const infoBox = document.getElementById('selected-info-box');
            const nameSpan = document.getElementById('active-method-name');
            const logoImg = document.getElementById('active-method-logo');

            if (method === 'bkash') {
                infoBox.className = "bg-pink-950/20 border border-pink-500/30 p-4 sm:p-5 rounded-2xl mb-6 text-center transition-all";
                nameSpan.className = "text-base sm:text-lg font-bold text-pink-400";
                nameSpan.innerText = "বিকাশ (Personal) পেমেন্ট নিয়ম";
                logoImg.src = "https://i.postimg.cc/vm8XHmjc/IMG-20260913-023828.jpg";
            } else if (method === 'nagad') {
                infoBox.className = "bg-orange-950/20 border border-orange-500/30 p-4 sm:p-5 rounded-2xl mb-6 text-center transition-all";
                nameSpan.className = "text-base sm:text-lg font-bold text-orange-400";
                nameSpan.innerText = "নগদ (Personal) পেমেন্ট নিয়ম";
                logoImg.src = "https://i.postimg.cc/mgCyS9x6/IMG-20260913-023227.jpg";
            } else if (method === 'rocket') {
                infoBox.className = "bg-purple-950/20 border border-purple-500/30 p-4 sm:p-5 rounded-2xl mb-6 text-center transition-all";
                nameSpan.className = "text-base sm:text-lg font-bold text-purple-400";
                nameSpan.innerText = "রকেট (Personal) পেমেন্ট নিয়ম";
                logoImg.src = "https://i.postimg.cc/RZKLTtrg/IMG-20260913-023446.jpg";
            }

            closePaymentModal();
        }

        function copyText(text, btnElement) {
            navigator.clipboard.writeText(text).then(() => {
                const span = btnElement.querySelector('span');
                const originalText = span.innerText;
                span.innerText = 'কপি হয়েছে!';
                btnElement.classList.add('bg-emerald-600', 'text-white');
                setTimeout(() => {
                    span.innerText = originalText;
                    btnElement.classList.remove('bg-emerald-600', 'text-white');
                }, 1500);
            });
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            toastMsg.innerText = message;
            toast.style.backgroundColor = isError ? '#ef4444' : '#10b981';
            toast.className = "show";
            setTimeout(function(){ 
                toast.className = toast.className.replace("show", ""); 
            }, 3500);
        }

        function resetSubmitBtn(btn) {
            btn.disabled = false;
            btn.innerHTML = '<span>পেমেন্ট কনফার্ম করুন</span> <i class="fa-solid fa-circle-check"></i>';
        }

        // মূল ভেরিফিকেশন ও সাবমিট হ্যান্ডলার
        async function handleFormSubmit(event) {
            event.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const name = document.getElementById('customerName').value.trim();
            let phone = document.getElementById('customerPhone').value.trim();
            const trxId = document.getElementById('trxId').value.trim().toUpperCase();

            if (!name || !phone || !trxId) {
                showToast("সবগুলো তথ্য সঠিকভাবে পূরণ করুন", true);
                return;
            }

            // Meta WhatsApp API ফরম্যাট (Country Code 88 নিশ্চিত করা)
            if (phone.startsWith('01')) {
                phone = '88' + phone;
            } else if (phone.startsWith('+88')) {
                phone = phone.replace('+', '');
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> পেমেন্ট যাচাই করা হচ্ছে...';

            try {
                // ১. Supabase থেকে পেমেন্ট রেকর্ড খুঁজে আনা
                const { data: paymentRecord, error: fetchError } = await supabase
                    .from('payments')
                    .select('*')
                    .eq('trx_id', trxId)
                    .maybeSingle();

                if (fetchError) {
                    console.error("Fetch Error:", fetchError);
                    showToast("ডাটাবেস কানেকশনে সমস্যা হয়েছে! একটু পর আবার চেষ্টা করুন।", true);
                    resetSubmitBtn(submitBtn);
                    return;
                }

                // যদি TrxID ডাটাবেসেই না থাকে
                if (!paymentRecord) {
                    showToast("❌ এই TrxID-এর কোনো পেমেন্ট রেকর্ড পাওয়া যায়নি! সঠিক TrxID দিন।", true);
                    resetSubmitBtn(submitBtn);
                    return;
                }

                // যদি TrxID ইতিমধ্যে ব্যবহার হয়ে গিয়ে থাকে
                if (paymentRecord.is_used === true) {
                    showToast("⚠️ এই TrxID টি ইতিমধ্যেই ব্যবহার করা হয়েছে!", true);
                    resetSubmitBtn(submitBtn);
                    return;
                }

                // ২. TrxID বৈধ হলে Supabase-এ স্ট্যাটাস আপডেট করা
                const { error: updateError } = await supabase
                    .from('payments')
                    .update({
                        is_used: true,
                        name: name,
                        whatsapp_number: phone,
                        method: selectedMethod
                    })
                    .eq('trx_id', trxId);

                if (updateError) {
                    console.error("Update Error:", updateError);
                    showToast("পেমেন্ট আপডেট ব্যর্থ হয়েছে। আবার চেষ্টা করুন।", true);
                    resetSubmitBtn(submitBtn);
                    return;
                }

                // ৩. ভেরিফিকেশন সফল হওয়ার পর Render Bot-এ কল পাঠানো
                fetch("https://technography-whatsapp-bot.onrender.com/verify-payment", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        name: name,
                        whatsapp_number: phone,
                        trx_id: trxId,
                        method: selectedMethod,
                        amount: paymentRecord.amount || 300
                    })
                }).catch(e => console.log("Render API Trigger:", e));

                // Meta Pixel Purchase Event
                if (typeof fbq === 'function') {
                    fbq('track', 'Purchase', { value: 300, currency: 'BDT' });
                }

                showToast("✅ পেমেন্ট ভেরিফাই সফল হয়েছে! WhatsApp-এ প্রোডাক্ট লিংক পাঠানো হচ্ছে।");
                document.getElementById('paymentForm').reset();

            } catch (err) {
                console.error("System Exception:", err);
                showToast("সিস্টেম এরর হয়েছে! পেজ রিলোড দিয়ে চেষ্টা করুন।", true);
            } finally {
                resetSubmitBtn(submitBtn);
            }
        }
    </script>
